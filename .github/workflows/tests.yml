name: regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install encoder dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run Python and JavaScript regression
        run: python tests/run_all.py
