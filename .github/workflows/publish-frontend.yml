name: publish-frontend

# Publica los archivos del FRONTEND (no clips) en el player hosteado en
# Cloudflare: bucket R2 `asciline-player` detras del Worker del mismo nombre,
# via `PUT /__upload/<key>` con `x-upload-token` + `x-sha256`.
#
# Existe porque la maquina de trabajo no tiene Node ni Python (modelo CI-only) y
# porque el repo es privado: nada fuera de CI puede leer estos archivos.
#
# Autorizacion: secret `CF_UPLOAD_TOKEN` del repo, que debe valer lo mismo que
# el secret `UPLOAD_TOKEN` del Worker. El modelo de trabajo dice que **ningun
# token se persiste**: se pone antes de publicar y se quema despues rotando
# `UPLOAD_TOKEN` en Cloudflare con un valor nuevo (eso deja el secret de GitHub
# inservible sin tener que borrarlo).
#
# El token NUNCA se imprime: curl lo recibe por `-H @-` desde stdin, no por la
# linea de comandos, y el `set -x` esta apagado.
#
# `scope`:
#   root  - solo la raiz del player (lo que sirve iargen.com/player/)
#   all   - la raiz y ademas las tres variantes de comparacion
#
# Verificacion doble: el runner calcula el SHA-256 y lo manda en `x-sha256`;
# R2 vuelve a calcularlo del cuerpo recibido y rechaza el put si no coincide.
# Un archivo corrupto en transito no puede entrar al bucket.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Que publicar"
        required: true
        default: root
        type: choice
        options: [root, all]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: https://asciline-player.iargen.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar que el secret existe
        env:
          TOKEN: ${{ secrets.CF_UPLOAD_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Falta el secret CF_UPLOAD_TOKEN del repositorio."
            exit 1
          fi
          echo "secret presente (${#TOKEN} caracteres)"

      - name: Publicar
        env:
          TOKEN: ${{ secrets.CF_UPLOAD_TOKEN }}
          SCOPE: ${{ inputs.scope }}
        run: |
          set -eu

          # Archivos compartidos por todas las paginas del player.
          LIBS="reader.js reader-v2.js render-webgl.js render-canvas2d.js"
          # Paginas que solo viven en la raiz.
          PAGES="tv-player.html diagnostic-player.html"

          KEYS=""
          for f in $LIBS $PAGES; do KEYS="$KEYS $f:frontend/$f"; done
          if [ "$SCOPE" = "all" ]; then
            for d in 1280-15 1280-12 1920-10; do
              for f in $LIBS; do KEYS="$KEYS $d/$f:frontend/$f"; done
            done
          fi

          {
            echo "## publish-frontend (scope: $SCOPE)"
            echo ""
            echo "| key | bytes | sha256 |"
            echo "| --- | ---: | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          for pair in $KEYS; do
            key="${pair%%:*}"
            src="${pair#*:}"
            if [ ! -f "$src" ]; then
              echo "::error::No existe $src"
              fail=1
              continue
            fi
            sha=$(sha256sum "$src" | cut -d' ' -f1)
            size=$(wc -c < "$src")

            # El token va por stdin (-H @-), nunca por argv ni por el log.
            if printf 'x-upload-token: %s\n' "$TOKEN" |
               curl -sS --fail-with-body -X PUT -T "$src" \
                 -H @- -H "x-sha256: $sha" \
                 "$BASE/__upload/$key" > result.json; then
              if jq -e '.ok == true' result.json > /dev/null; then
                echo "OK  $key  $size B  $sha"
                echo "| \`$key\` | $size | \`$sha\` |" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::error::El worker rechazo $key: $(cat result.json)"
                fail=1
              fi
            else
              echo "::error::Fallo el PUT de $key: $(cat result.json 2>/dev/null || true)"
              fail=1
            fi
          done

          exit $fail

      - name: Verificar lo publicado
        run: |
          set -eu
          LIBS="reader.js reader-v2.js render-webgl.js render-canvas2d.js"
          PAGES="tv-player.html diagnostic-player.html"
          fail=0
          for f in $LIBS $PAGES; do
            local_sha=$(sha256sum "frontend/$f" | cut -d' ' -f1)
            remote_sha=$(curl -sS "$BASE/$f" | sha256sum | cut -d' ' -f1)
            if [ "$local_sha" = "$remote_sha" ]; then
              echo "identico  $f  $local_sha"
            else
              echo "::error::$f servido != repo (repo $local_sha, servido $remote_sha)"
              fail=1
            fi
          done
          exit $fail
