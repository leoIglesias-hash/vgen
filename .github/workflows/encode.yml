name: encode

# Encodea un video fuente en la nube y publica el .asclv + preview MP4 como
# artifacts descargables. Se lanza a mano desde la pestaña Actions ("Run workflow").
#
# El video fuente NO vive en main (política de .gitignore): se lee de la rama
# huérfana `assets`, carpeta inputs/. Defaults = perfil HQ de producción
# (graphic-hq 768, adaptive kmeans-oklab, dither off, v2). El refit E-12 sigue
# yendo por `extra` (--palette-refit 5 en la receta de producto). Para
# reproducir referencias históricas con tramado (P-02, adef9e53…) hay que
# pasar dither=auto a mano — decisión del operador 2026-08-29.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Archivo dentro de inputs/ de la rama assets"
        default: "TKN-2443-GANADOR- 15seg-.mp4"
        required: true
      profile:
        description: "Perfil (custom/detail/balanced/graphic/graphic-hq/graphic-ultra/color)"
        default: "graphic-hq"
      fps:
        default: "15"
      palette:
        description: "per-frame / global / block / adaptive"
        default: "adaptive"
      algorithm:
        description: "median-cut / fast-octree / kmeans-rgb / kmeans-oklab"
        default: "kmeans-oklab"
      dither:
        description: "off = receta de producto desde 2026-08-29; auto = tramado calibrado (referencias historicas)"
        default: "off"
      format:
        description: "v1 / v2"
        default: "v2"
      extra:
        description: "Flags extra para make_clip.py (opcional)"
        default: ""
      preview:
        description: "Generar preview.mp4 de control (decodificacion del .asclv; el producto es el .asclv)"
        type: boolean
        default: false
      zopfli:
        description: "Comprimir con Zopfli (E-08): archivo mas chico, encode mas lento"
        type: boolean
        default: true
      tile:
        description: "E-09: tile regional v2 (4..32) o 'sweep' para barrer {4,8,12,16,24,32}"
        default: "16"
      overlay:
        description: "off: sin overlay · panel: F7 (reserved 10, panel v1 de 20 numeros) · patches: INT-003 (reserved 32, sidecar v2 con tipografia libre, numeros grandes por tercios y palabra de eleccion)"
        type: choice
        options:
          - "off"
          - panel
          - patches
        default: "off"

permissions:
  contents: read

jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Checkout rama assets (videos fuente)
        uses: actions/checkout@v4
        with:
          ref: assets
          path: assets-src
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Dependencias del encoder
        run: python -m pip install -r backend/requirements.txt
      - name: Zopfli (E-08, opcional)
        if: ${{ inputs.zopfli }}
        run: python -m pip install zopfli
      - name: Encode
        run: |
          mkdir -p outputs work
          SRC="assets-src/inputs/${{ inputs.source }}"
          if [ ! -f "$SRC" ]; then
            echo "::error::No existe $SRC en la rama assets. Subir el video a esa rama primero."
            exit 1
          fi
          if [ "${{ inputs.tile }}" = "sweep" ]; then
            TILE_ARGS="--tile-sweep"
          else
            TILE_ARGS="--tile-size ${{ inputs.tile }}"
          fi
          if [ "${{ inputs.overlay }}" = "panel" ]; then
            OVERLAY_ARGS="--reserved 10"
          elif [ "${{ inputs.overlay }}" = "patches" ]; then
            OVERLAY_ARGS="--reserved 32"
          else
            OVERLAY_ARGS=""
          fi
          # E-14: RSS maximo del encode, medible en el log y en el summary
          if ! command -v /usr/bin/time > /dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq time
          fi
          /usr/bin/time -v -o time.txt python backend/make_clip.py "$SRC" \
            --format "${{ inputs.format }}" \
            --profile "${{ inputs.profile }}" \
            --fps "${{ inputs.fps }}" \
            --palette "${{ inputs.palette }}" \
            --palette-algorithm "${{ inputs.algorithm }}" \
            --dither "${{ inputs.dither }}" \
            $TILE_ARGS \
            $OVERLAY_ARGS \
            ${{ inputs.extra }} \
            --out outputs/clip.asclv
          grep -E "Maximum resident|Elapsed" time.txt
      - name: Sidecar del overlay (F7 panel v1 / INT-003 parches v2)
        if: ${{ inputs.overlay != 'off' }}
        run: |
          if [ "${{ inputs.overlay }}" = "panel" ]; then
            python tools/bake_glyphs.py --out outputs/glyphs.bin
            python tools/make_panel.py outputs/clip.asclv \
              --glyphs outputs/glyphs.bin --out outputs/clip.slots
          else
            python tools/make_patch_pack.py outputs/clip.asclv \
              --out outputs/clip.slots --sample-data outputs/data.txt
          fi
          sha256sum outputs/clip.slots | tee -a sha-slots.txt
      - name: Medición (bench_ref) y SHA-256
        run: |
          python tools/bench_ref.py outputs/clip.asclv \
            --source "assets-src/inputs/${{ inputs.source }}" | tee bench.md
          sha256sum outputs/clip.asclv | tee sha256.txt
          {
            echo "## Resultado del encode"
            echo ""
            echo "Fuente: \`${{ inputs.source }}\` · perfil \`${{ inputs.profile }}\` · ${{ inputs.fps }} fps · ${{ inputs.palette }}/${{ inputs.algorithm }} · dither ${{ inputs.dither }} · ${{ inputs.format }} · zopfli ${{ inputs.zopfli }} · tile ${{ inputs.tile }} · overlay ${{ inputs.overlay }}"
            echo ""
            cat bench.md
            echo ""
            echo '```'
            cat sha256.txt
            echo '```'
            echo ""
            grep -E "Maximum resident|Elapsed" time.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preview MP4 de control (opcional)
        if: ${{ inputs.preview }}
        run: |
          python backend/ascl_bundle.py unpack outputs/clip.asclv work
          # sin --no-preview: ese flag corta ANTES de escribir el mp4; scale 1 = resolucion nativa
          python backend/ascl_decode.py work/clip.ascl --mp4 outputs/preview.mp4 --scale 1
      - name: Publicar clip.asclv + medición
        uses: actions/upload-artifact@v4
        with:
          name: clip-asclv
          path: |
            outputs/clip.asclv
            outputs/clip.slots
            outputs/data.txt
            bench.md
            sha256.txt
            sha-slots.txt
            time.txt
          retention-days: 14
      - name: Publicar preview.mp4
        if: ${{ inputs.preview }}
        uses: actions/upload-artifact@v4
        with:
          name: preview-mp4
          path: outputs/preview.mp4
          retention-days: 14
