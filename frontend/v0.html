<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCILINE-hybrid - pack v0</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  html { background: #101014; color: #e8e8ee; font-family: monospace; }
  #head { position: absolute; left: 0; right: 0; top: 0; padding: 0.25em 0.6em; }
  #titulo { font-size: 0.7em; color: #9aa0b4; }
  #estado { font-size: 1.15em; display: block; }
  #estado b { color: #ffd479; }
  #alphaBg { position: absolute; background: #1f6f3f; display: none; }
  #alphaBg.on { display: block; }
  #video { position: absolute; background: #000; }
  #capa { position: absolute; }
  #capa.off { display: none; }
  /* H-16: la fuente de la capa es Hobo por defecto (decision del operador,
   * 2026-09-04: "que sea la fuente por defecto asi no agrego mas funciones").
   * Se sirve al lado de la pagina, en el mismo prefijo v0/. El archivo es
   * OpenType con contornos CFF aunque la extension diga .ttf, por eso el
   * format() es "opentype": declararlo mal es la forma mas facil de que un
   * WebView viejo lo descarte sin decir nada. Si no llega a tiempo, la capa
   * dibuja en monospace y la fila lo declara: nunca se finge la fuente. */
  @font-face { font-family: "Hobo"; src: url("HoboStd.ttf") format("opentype");
               font-weight: normal; font-style: normal; }
  /* Un nodo fuera de pantalla que USA la fuente: en Chromium 70 la descarga
   * arranca cuando algo del documento la pide, y un canvas no siempre alcanza
   * para dispararla. */
  #hobo { position: absolute; left: -9999px; top: 0; font-family: "Hobo";
          font-size: 40px; }
  #side { position: absolute; overflow-x: hidden; overflow-y: auto; }
  /* H-16: filas mas altas y letra mas grande. La tabla es lo que el operador
   * mira mientras prueba, y ahora tiene el alto entero de la pantalla. */
  table { border-collapse: collapse; width: 100%; font-size: 0.62em; }
  th, td { border: 1px solid #33384a; padding: 0.38em 0.35em; text-align: left;
           white-space: nowrap; }
  th { background: #1a1e2c; }
  td.ok { color: #7ee08a; }
  td.no { color: #ff8f8f; }
  /* H-16: la leyenda pasa a una COLUMNA A LA IZQUIERDA (pedido del operador,
   * 2026-09-04: "deja al menos 10 siempre a la vista, alineada a la izquierda
   * dandole mas lugar a los logs de prueba para que bajen mientras
   * probamos"). Ya no compite por el ancho con la tabla. Y solo se muestran
   * las teclas VIGENTES: lo ya consagrado sigue andando, pero se busca en
   * docs/MANUAL-TECLAS-V0.md en vez de ocupar pantalla. */
  #keys { position: absolute; left: 0; padding: 0 0.4em 0 0.6em;
          box-sizing: border-box; overflow: hidden; }
  #buffer { font-size: 1em; color: #ffd479; height: 1.15em;
            letter-spacing: 0.08em; }
  #teclas .op { display: block; margin: 0.12em 0; cursor: pointer;
                line-height: 1.3; white-space: nowrap; overflow: hidden; }
  #teclas .now { font-size: 0.72em; color: #ffffff; }
  #teclas .tool { font-size: 0.62em; color: #c3c8da; }
  #teclas .n { display: inline-block; min-width: 1.7em; text-align: center;
               background: #2a2f45; border: 1px solid #4a5170; color: #ffd479;
               margin-right: 0.35em; }
  #teclas .now .n { background: #ffd479; border-color: #ffd479;
                    color: #101014; }
  #foot { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 0.6em;
          font-size: 0.55em; color: #8d93a8; overflow: hidden; }
  #full { position: absolute; left: 0; top: 0; right: 0; bottom: 0;
          background: #05060a; display: none; padding: 0.5em; }
  #full.on { display: block; }
  #report { width: 100%; height: 100%; font: inherit; font-size: 0.72em;
            background: #05060a; color: #cdd3e6; border: 0; resize: none; }
</style>
</head>
<body>

<div id="head">
  <span id="titulo">pack v0 - por donde entra el video, el paquete, y la capa encima</span>
  <span id="estado">listo</span>
</div>

<div id="alphaBg"></div>
<video id="video" muted playsinline></video>
<canvas id="capa" class="off"></canvas>
<div id="side">
  <table>
    <thead><tr><th>pieza</th><th>ok</th><th>caidos/total</th><th>1er</th>
               <th>congel</th><th>cambio</th></tr></thead>
    <tbody id="filas"></tbody>
  </table>
</div>

<div id="keys">
  <div id="buffer"></div>

</div>

<div id="foot"><span id="env"></span></div>
<span id="hobo">Hobo</span>

<div id="full"><textarea id="report" readonly></textarea></div>

<script src="keypad.js"></script>
<script src="vgenfeed.js"></script>
<script src="vgencache.js"></script>
<script>
"use strict";

/* v0.html - H-10 + H-13: reproduce el pack v0 y REPORTA lo que el aparato hizo.
 *
 * Reemplaza a la sonda sintetica que se descarto (H-4): las mismas preguntas
 * -que codecs, alfa, blob:, MSE, panel real, cuadros caidos- se contestan como
 * subproducto de reproducir material verdadero, y en varios aparatos. Un
 * canPlayType dice "probably"; un video que corre sin caer cuadros dice que si.
 *
 * H-13 (2026-09-01) suma "por donde entra el PAQUETE": con los mismos
 * segmentos CMAF ya publicados (dash/init.m4s + chunk-*.m4s) y cero emision
 * nueva, se prueba MSE (96), el Blob concatenado (97), el intercambio de orden
 * (98), el cambio de pieza a demanda (8) y el bucle de 60 s (99). El 5 corre
 * las cinco; el 1 corre TODO. Las puertas viven en vgenfeed.js, que el muxer
 * de H-8 va a reusar.
 *
 * H-11 (2026-09-01) suma LA CAPA: un canvas de intervencion encima del <video>
 * -numero, ruleta y texto dibujados con la API nativa de Canvas2D- con tres
 * cargas: nada (el canvas no existe: display none), un rectangulo chico
 * repintado a 15 fps, y la pantalla completa pintada UNA vez. Se mide sobre
 * Baseline y sobre VP9 (81 / 82; el 80 es el lote entero de la visita). La
 * pregunta es S5: si el canvas saca al video de su plano de hardware, los
 * caidos suben con la capa y la intervencion va AL LADO, no encima. El canvas
 * se dimensiona AL PANEL (screen), nunca a la superficie del WebView.
 *
 * H-12 (2026-09-02) suma LA CACHE: el paquete residente en IndexedDB (84 baja
 * con progreso, guarda pineado por contenido y poda lo viejo; 85 reproduce
 * desde ahi sin red -la tecla de despues de REINICIAR-; 86 borra) y la prueba
 * de techo con 10/25/50 MB de ruido, cuya respuesta es el nombre del error.
 * La puerta a la base vive en vgencache.js. La cabecera del reporte dice que
 * hay guardado al cargar: eso, tras un reinicio, es la prueba de persistencia.
 *
 * PANTALLA FIJA, SIN SCROLL (pedido del operador, 2026-09-01): en una TV el
 * scroll se hace con flechas y se pierde de vista lo que importa. Todo entra en
 * una pantalla, TODAS las piezas se reproducen en el MISMO recuadro -una sola
 * etiqueta <video>, incluida la de alfa- y la tabla queda siempre a la vista,
 * al lado del video y no debajo. Por eso la geometria se calcula en JS: asi el
 * recuadro respeta 16:9 sin depender de object-fit, que en WebViews viejos no
 * existe.
 *
 * MEDICION (H-13): "atascos" cuenta `waiting` solo DESPUES de arrancar (el
 * inicial es carga, no atasco); "congel" cuenta muestras de 100 ms sin avance
 * de currentTime estando en play (para los caminos donde el contador de cuadros
 * es ciego); la fila dice "ciego" cuando el contador no se movio; y NO se pausa
 * al terminar: el simbolo de play que el operador vio era la pausa nuestra, no
 * el aparato. La pieza siguiente reemplaza el src; la ultima queda sonando.
 *
 * ES5.1 estricto (gate tests/test_frontend_compatibility.js): sin fetch, sin
 * Promise, sin JSON, sin arrow, sin let/const. El manifiesto es texto tabulado
 * justamente por eso. */

var SECONDS = 10;          /* cuanto se reproduce cada pieza */
var SWITCH_SECONDS = 4;    /* cuanto se mira cada pieza tras un cambio a demanda */
var LOOP_SECONDS = 60;     /* el bucle */
var MSE_MIME = 'video/mp4; codecs="avc1.42C01F"';   /* el init de dash/ */
var SEGMENTS = 16;         /* chunk-00001 .. chunk-00016 */
var pieces = [];           /* filas del MANIFEST.tsv */
var extras = [];           /* filas sinteticas: blob:, mse:, cambio:, bucle: */
var results = {};          /* id -> medicion */
var base = "";
var lastSteps = null;      /* ultima corrida, para repetirla con una tecla */
var aborted = false;       /* corta una secuencia en curso */
var feeding = null;        /* mango del feedMse en curso, para cortarlo */
var lastObjectUrl = "";    /* blob: vivo, se libera al crear el siguiente */

function byId(id) { return document.getElementById(id); }

function param(name) {
  var pattern = new RegExp("[?&]" + name + "=([^&]*)");
  var found = pattern.exec(window.location.search);
  return found ? decodeURIComponent(found[1]) : "";
}

function text(node, value) {
  while (node.firstChild) { node.removeChild(node.firstChild); }
  node.appendChild(document.createTextNode(value));
}

function px(node, left, top, width, height) {
  node.style.left = left + "px";
  node.style.top = top + "px";
  node.style.width = width + "px";
  node.style.height = height + "px";
}

/* Geometria de una sola pantalla. La caja le da al WebView una superficie de
 * 3840x2160 sobre un panel de 1280x720, asi que todo -tipografia incluida- se
 * calcula desde el ancho real y nada se fija en pixeles a mano. */
/* H-16: tres columnas en vez de una franja de teclas abajo.
 *
 * Antes la leyenda se comia el 26 % del alto a lo ancho de toda la pantalla, y
 * la tabla -que es lo que el operador mira mientras prueba- quedaba encajonada
 * a la derecha del video con la mitad del alto. Ahora: teclas a la IZQUIERDA en
 * una columna angosta, video al medio y tabla a la derecha con el alto entero.
 * Los renglones de la corrida bajan mientras se prueba, que era el pedido. */
function layout() {
  var w = window.innerWidth || 1280;
  var h = window.innerHeight || 720;
  var headH, footH, midTop, midH, keysW, stageW, stageX, vw, vh, sideX;
  document.documentElement.style.fontSize =
    Math.max(11, Math.round(w / 46)) + "px";
  headH = Math.round(h * 0.13);
  footH = Math.round(h * 0.06);
  midTop = headH;
  midH = h - headH - footH;
  /* La columna de teclas: angosta, pero nunca tanto como para PARTIR una
   * etiqueta. En 1280 son 243 px y entran los renglones mas largos; en una
   * pantalla angosta el 19 % no alcanza -medido: a 399 px de ancho quedaba
   * "cache: gua..."-, asi que hay un piso de 200 px que a su vez no puede
   * comerse mas de un tercio del ancho. */
  keysW = Math.max(Math.round(w * 0.19),
                   Math.min(200, Math.round(w * 0.34)));
  stageX = keysW;
  stageW = Math.round((w - keysW) * 0.54);
  /* Las piezas son 16:9: el recuadro toma esa forma para que el video no se
   * deforme, y la tabla se queda con lo que sobra a la derecha. */
  vw = stageW;
  vh = Math.round(stageW * 9 / 16);
  if (vh > midH) { vh = midH; vw = Math.round(midH * 16 / 9); }
  px(byId("video"), stageX, midTop + Math.round((midH - vh) / 2), vw, vh);
  px(byId("alphaBg"), stageX, midTop + Math.round((midH - vh) / 2), vw, vh);
  px(byId("capa"), stageX, midTop + Math.round((midH - vh) / 2), vw, vh);
  sizeCapa(vw, vh);
  sideX = stageX + stageW + 8;
  px(byId("side"), sideX, midTop, w - sideX - 12, midH);
  byId("keys").style.top = midTop + "px";
  byId("keys").style.width = keysW + "px";
  byId("keys").style.height = midH + "px";
}

function say(value) {
  var node = byId("estado");
  while (node.firstChild) { node.removeChild(node.firstChild); }
  node.appendChild(document.createTextNode(value));
}

/* --- manifiesto: texto tabulado, nunca JSON --- */

function parseManifest(body) {
  var lines = body.split("\n");
  var out = [];
  var i, line, f;
  for (i = 0; i < lines.length; i++) {
    line = lines[i];
    if (line.length === 0 || line.charAt(0) === "#") { continue; }
    f = line.split("\t");
    if (f.length < 6) { continue; }
    out.push({ id: f[0], role: f[1], mime: f[2], file: f[3],
               bytes: f[4], sha256: f[5], note: f.length > 6 ? f[6] : "" });
  }
  return out;
}

function get(url, onText, onFail) {
  var xhr = new XMLHttpRequest();
  xhr.open("GET", url, true);
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) { return; }
    if (xhr.status >= 200 && xhr.status < 300) { onText(xhr.responseText); }
    else { onFail("HTTP " + xhr.status); }
  };
  xhr.send(null);
}

function findPiece(id) {
  var i;
  for (i = 0; i < pieces.length; i++) {
    if (pieces[i].id === id) { return pieces[i]; }
  }
  return null;
}

/* Fila sintetica: una medicion que no sale de una linea del manifiesto. Si ya
 * existe una con ese id (repetir), se reemplaza en vez de duplicarse. */
function addExtra(piece) {
  var i;
  for (i = 0; i < extras.length; i++) {
    if (extras[i].id === piece.id) { extras[i] = piece; return piece; }
  }
  extras.push(piece);
  return piece;
}

function fake(id, role, mime, file, note) {
  return { id: id, role: role, mime: mime, file: file, bytes: "", sha256: "",
           note: note || "" };
}

/* --- medicion --- */

function quality(video) {
  if (video.getVideoPlaybackQuality) {
    var q = video.getVideoPlaybackQuality();
    return { total: q.totalVideoFrames, dropped: q.droppedVideoFrames };
  }
  if (typeof video.webkitDecodedFrameCount === "number") {
    return { total: video.webkitDecodedFrameCount,
             dropped: video.webkitDroppedFrameCount || 0 };
  }
  return null;
}

function blank(piece) {
  return { id: piece.id, says: "", started: false, firstMs: -1,
           total: 0, dropped: 0, driftMs: 0, stalls: 0, frozen: 0,
           switchMs: -1, laps: 0, duration: -1, hidden: 0, bytes: piece.bytes,
           noVideo: false, error: "" };
}

function stopFeeding() {
  if (feeding && feeding.abort) { feeding.abort(); }
  feeding = null;
}

/* Reproduce una pieza y llama a done(medicion). No hay Promise: se encadena
 * con callbacks, que es lo que este piso permite. Siempre en el MISMO <video>:
 * la de alfa tambien, con el fondo verde detras.
 *
 * opts.feed(video, row)  en vez de poner src: quien alimenta (MSE, cambio)
 * opts.seconds           cuanto medir (SECONDS por defecto)
 * opts.loop              video.loop = true y se cuentan las vueltas (seeking)
 * opts.capa              carga de la capa H-11: "none" | "rect" | "full"
 *
 * La medicion NO pausa al terminar (ver cabecera). */
function measure(piece, src, done, opts) {
  var video = byId("video");
  var row = blank(piece);
  var o = opts || {};
  var seconds = o.seconds > 0 ? o.seconds : SECONDS;
  var t0 = 0, wall0 = 0, lastTime = 0, played = 0, raf = 0, finished = false;
  var before = quality(video);
  var baseTotal = before ? before.total : 0;
  var baseDropped = before ? before.dropped : 0;

  /* El waiting inicial es carga, no atasco: solo cuenta despues de arrancar. */
  function onStall() { if (row.started) { row.stalls++; } }
  function onLap() { if (row.started) { row.laps++; } }
  function onError() { row.error = "error de carga/decodificacion"; finish(); }

  function cleanup() {
    video.removeEventListener("waiting", onStall, false);
    video.removeEventListener("seeking", onLap, false);
    video.removeEventListener("error", onError, false);
    if (raf) { window.clearTimeout(raf); raf = 0; }
  }

  function finish() {
    if (finished) { return; }
    finished = true;
    var after = quality(video);
    if (after) {
      row.total = after.total - baseTotal;
      row.dropped = after.dropped - baseDropped;
      /* H-12b: los contadores del video se reinician al cambiar de fuente, y
       * una resta contra una linea de base que ya no existe da negativo. En la
       * caja salio "caidos -3" en blob:cmaf. Si CUALQUIERA de las dos restas da
       * negativa, la base no vale y se toman los absolutos; despues se acota,
       * porque un numero negativo de cuadros caidos no es un dato: es un error
       * de contabilidad disfrazado de medicion. */
      if (row.total < 0 || row.dropped < 0) {
        row.total = after.total;
        row.dropped = after.dropped;
      }
      if (row.dropped < 0) { row.dropped = 0; }
      if (row.total > 0 && row.dropped > row.total) { row.dropped = row.total; }
    }
    if (row.started) {
      var wall = (new Date().getTime() - wall0) / 1000;
      row.driftMs = Math.round((wall - played) * 1000);
    }
    if (typeof video.duration === "number" && isFinite(video.duration)) {
      row.duration = Math.round(video.duration * 10) / 10;
    }
    /* Sin pausa: la pieza sigue hasta que la proxima la reemplace. Solo se
     * corta el alimentador, que ya no tiene a quien darle. */
    stopFeeding();
    cleanup();
    done(row);
  }

  function tick() {
    var ct, now;
    if (finished) { return; }
    if (aborted) { finish(); return; }
    if (row.error) { finish(); return; }
    ct = video.currentTime;
    now = new Date().getTime();
    if (!row.started && ct > 0) {
      row.started = true;
      row.firstMs = now - t0;
      wall0 = now;
      lastTime = ct;
    } else if (row.started) {
      /* Tiempo de media reproducido, robusto al bucle (ct vuelve a 0). */
      if (ct >= lastTime) { played += ct - lastTime; } else { played += ct; }
      if (ct === lastTime && !video.paused && !video.ended) { row.frozen++; }
      if (document.hidden) { row.hidden++; }
      lastTime = ct;
    }
    if (row.started && (now - wall0) >= seconds * 1000) {
      finish(); return;
    }
    if (!row.started && (now - t0) > 15000) {
      row.error = "no arranco en 15 s"; finish(); return;
    }
    raf = window.setTimeout(tick, 100);
  }

  /* El fondo verde solo aparece para la pieza con alfa: si el aparato la
   * compone, se ve verde alrededor de la figura; si no, se ve negro. */
  byId("alphaBg").className = piece.role === "alpha" ? "on" : "";
  row.says = video.canPlayType(piece.mime) || "no";
  video.loop = o.loop ? true : false;
  setCapa(o.capa || "none");
  video.addEventListener("waiting", onStall, false);
  video.addEventListener("seeking", onLap, false);
  video.addEventListener("error", onError, false);
  stopFeeding();
  t0 = new Date().getTime();
  if (o.feed) {
    o.feed(video, row);
  } else {
    video.src = src;
    video.load();
    video.play();
  }
  tick();
}

/* --- tabla y reporte --- */

function cell(row, value, good) {
  var td = document.createElement("td");
  if (good === true) { td.className = "ok"; }
  if (good === false) { td.className = "no"; }
  text(td, value);
  row.appendChild(td);
}

/* noVideo: la fila mide otra cosa (guardar, techo) y no tiene cuadros. */
function blind(r) { return r.started && !r.error && r.total === 0 && !r.noVideo; }

function drawRow(body, piece) {
  var r = results[piece.id];
  var tr = document.createElement("tr");
  cell(tr, piece.id);
  if (!r) {
    cell(tr, "-"); cell(tr, "-"); cell(tr, "-"); cell(tr, "-"); cell(tr, "-");
  } else {
    cell(tr, r.error ? "ERR" : (r.started ? "si" : "no"),
         r.started && !r.error);
    if (blind(r)) {
      cell(tr, "ciego");
    } else {
      /* Gate aprobado: caidos <= 3 % de los contados. */
      cell(tr, r.total ? (r.dropped + "/" + r.total) : "-",
           r.total ? (r.dropped * 100 <= r.total * 3) : undefined);
    }
    cell(tr, r.firstMs < 0 ? "-" : r.firstMs + "ms");
    cell(tr, (r.started && !r.noVideo) ? String(r.frozen) : "-",
         (r.started && !r.noVideo) ? (r.frozen === 0) : undefined);
    cell(tr, r.switchMs < 0 ? "-" : r.switchMs + "ms",
         r.switchMs < 0 ? undefined : (r.switchMs <= 1000));
  }
  body.appendChild(tr);
}

function draw() {
  var body = byId("filas");
  while (body.firstChild) { body.removeChild(body.firstChild); }
  var i;
  for (i = 0; i < pieces.length; i++) { drawRow(body, pieces[i]); }
  for (i = 0; i < extras.length; i++) { drawRow(body, extras[i]); }
  /* H-16: los renglones BAJAN mientras se prueba (pedido del operador). La
   * tabla ahora tiene el alto entero, pero una corrida larga igual la pasa;
   * dejarla arriba obligaria a mirar filas viejas mientras la nueva queda
   * fuera de cuadro. En la TV no hay como scrollear a mano. */
  scrollAlFinal();
  writeReport();
}

function scrollAlFinal() {
  var side = byId("side");
  if (side && typeof side.scrollHeight === "number") {
    side.scrollTop = side.scrollHeight;
  }
}

function environment() {
  var video = byId("video");
  var lines = [];
  var url = window.URL || window.webkitURL;
  lines.push("ua\t" + navigator.userAgent);
  lines.push("panel\t" + screen.width + "x" + screen.height +
             "\tdpr " + (window.devicePixelRatio || 1) +
             "\tsuperficie " + window.innerWidth + "x" + window.innerHeight);
  lines.push("capa\t" + capa.w + "x" + capa.h + "\tk " + (Math.round(capa.k * 1000) / 1000) +
             "\tfuente " + capaFuente.name +
             (capaFuente.ms ? " (" + capaFuente.ms + " ms)" : " (esperando)"));
  lines.push("mse\t" + (window.MediaSource ? "si" : "no") +
             "\tchangeType\t" + (VGenFeed.hasChangeType() ? "si" : "no") +
             "\tblob\t" + ((window.Blob && url && url.createObjectURL) ? "si" : "no"));
  if (window.MediaSource && window.MediaSource.isTypeSupported) {
    lines.push("mse.h264\t" +
      (window.MediaSource.isTypeSupported('video/mp4; codecs="avc1.42E01F"') ? "si" : "no") +
      "\tmse.vp9\t" +
      (window.MediaSource.isTypeSupported('video/webm; codecs="vp9"') ? "si" : "no"));
  }
  lines.push("rvfc\t" + (video.requestVideoFrameCallback ? "si" : "no") +
             "\tindexeddb\t" + (window.indexedDB ? "si" : "no") +
             "\tquality\t" + (video.getVideoPlaybackQuality ? "si" : "no"));
  lines.push("cache\t" + cacheInfo.says + "\tguardadas " + cacheInfo.n +
             "\t" + cacheInfo.bytes + " B" +
             (cacheInfo.quota ? "\tcuota " + cacheInfo.quota : ""));
  lines.push("hls\t" + (video.canPlayType("application/vnd.apple.mpegurl") || "no") +
             "\tdash\t" + (video.canPlayType("application/dash+xml") || "no"));
  return lines;
}

function noteOf(piece, r) {
  var parts = [];
  if (r.error) { parts.push(r.error); }
  if (blind(r)) { parts.push("ciego"); }
  if (r.laps) { parts.push("vueltas " + r.laps); }
  if (r.hidden) { parts.push("oculto " + r.hidden); }
  if (piece.role === "paquete" && r.duration >= 0) { parts.push("dur " + r.duration + "s"); }
  if (piece.note) { parts.push(piece.note); }
  return parts.join("; ");
}

function reportLine(piece) {
  var r = results[piece.id];
  if (!r) { return ""; }
  return piece.id + "\t" + r.says + "\t" + (r.started ? "si" : "no") +
         "\t" + r.firstMs + "\t" + r.dropped + "\t" + r.total +
         "\t" + r.driftMs + "\t" + r.stalls + "\t" + r.frozen +
         "\t" + r.switchMs + "\t" + noteOf(piece, r);
}

function writeReport() {
  var lines = ["# pack v0 - reporte de aparato"];
  var i, line;
  var env = environment();
  for (i = 0; i < env.length; i++) { lines.push(env[i]); }
  lines.push("# atascos = waiting despues de arrancar; congel = muestras de 100 ms sin avance; oculto = muestras con la pagina oculta (el navegador pausa el video mudo)");
  lines.push("# id\tdice\tarranco\t1er_ms\tcaidos\ttotal\tderiva_ms\tatascos\tcongel\tcambio_ms\tnota");
  for (i = 0; i < pieces.length; i++) {
    line = reportLine(pieces[i]);
    if (line) { lines.push(line); }
  }
  for (i = 0; i < extras.length; i++) {
    line = reportLine(extras[i]);
    if (line) { lines.push(line); }
  }
  byId("report").value = lines.join("\n");
  text(byId("env"), "panel " + screen.width + "x" + screen.height +
       " · superficie " + window.innerWidth + "x" + window.innerHeight +
       " · 95 para ver el reporte entero");
}

/* --- pasos: cada tecla arma una lista de pasos y se corren en secuencia --- */

function withRole(role) {
  var out = [], i;
  for (i = 0; i < pieces.length; i++) {
    if (pieces[i].role === role) { out.push(pieces[i]); }
  }
  return out;
}

function baseOnly() { return withRole("base"); }

function finishRow(id, done) {
  return function (row) {
    results[id] = row;
    draw();
    done();
  };
}

function pieceStep(piece) {
  return { id: piece.id, go: function (done) {
    measure(piece, base + piece.file, finishRow(piece.id, done));
  } };
}

function pieceSteps(list) {
  var out = [], i;
  for (i = 0; i < list.length; i++) { out.push(pieceStep(list[i])); }
  return out;
}

function runSteps(steps, index) {
  var step;
  if (index === 0) { lastSteps = steps; aborted = false; }
  if (aborted || index >= steps.length) {
    say(aborted ? "cortado" : "listo");
    draw();
    return;
  }
  step = steps[index];
  say((index + 1) + "/" + steps.length + "  " + step.id);
  step.go(function () {
    window.setTimeout(function () { runSteps(steps, index + 1); }, 400);
  });
}

function runOnly(id) {
  var piece = findPiece(id);
  if (piece) { runSteps([pieceStep(piece)], 0); return; }
  say("no esta la pieza " + id);
}

/* --- H-13: por donde entra el paquete --- */

/* Los segmentos CMAF publicados por el pack, en el orden pedido. `order` es
 * una lista de numeros 1..16; sin orden, 1..16. El init va siempre primero. */
function dashUrls(order) {
  var urls = [base + "dash/init.m4s"];
  var i, n, list = order;
  if (!list) {
    list = [];
    for (i = 1; i <= SEGMENTS; i++) { list.push(i); }
  }
  for (i = 0; i < list.length; i++) {
    n = "0000" + list[i];
    urls.push(base + "dash/chunk-" + n.slice(n.length - 5) + ".m4s");
  }
  return urls;
}

/* 1..8, 13..16, 9..12: si el aparato cose eso sin costura, las piezas se
 * pueden intercambiar (S12) con solo cambiar el orden de anexo. */
function swappedOrder() {
  var out = [], i;
  for (i = 1; i <= 8; i++) { out.push(i); }
  for (i = 13; i <= 16; i++) { out.push(i); }
  for (i = 9; i <= 12; i++) { out.push(i); }
  return out;
}

function orderLabel(order) {
  return order ? "orden 1-8,13-16,9-12" : "orden 1-16";
}

/* 96 / 98: camino B. Un SourceBuffer, anexo encadenado por updateend. En modo
 * "sequence" el buffer reescribe los tiempos en orden de anexo: eso es lo que
 * un intercambio de piezas necesita, y por eso el 98 lo pide. */
function stepMse(id, order) {
  return { id: id, go: function (done) {
    var piece = addExtra(fake(id, "paquete", MSE_MIME, "dash/*", orderLabel(order)));
    var row;
    if (VGenFeed.mseSupport(MSE_MIME) !== "si") {
      row = blank(piece); row.says = VGenFeed.mseSupport(MSE_MIME);
      row.error = "sin MSE para " + MSE_MIME;
      finishRow(id, done)(row);
      return;
    }
    measure(piece, "", finishRow(id, done), { feed: function (video, r) {
      feeding = VGenFeed.feedMse(video, MSE_MIME, dashUrls(order), {
        mode: order ? "sequence" : "segments",
        onWarn: function (why) { piece.note += "; " + why; },
        onError: function (why) { r.error = why; }
      });
      if (!feeding) { r.error = "sin MediaSource"; }
    } });
  } };
}

/* 97 / 98: camino A. init + segmentos pegados en un Blob y reproducidos como
 * archivo. La bajada no cuenta en 1er_ms: A es "desde cache". */
function stepBlob(id, order) {
  return { id: id, go: function (done) {
    var piece = addExtra(fake(id, "paquete", MSE_MIME, "dash/* (blob)",
                              orderLabel(order)));
    var urls = dashUrls(order);
    var row;
    say("bajando " + urls.length + " pedazos: " + id);
    VGenFeed.getAll(urls, function (error, parts) {
      var blob, url, total = 0, i;
      if (error) {
        row = blank(piece); row.error = error;
        finishRow(id, done)(row);
        return;
      }
      for (i = 0; i < parts.length; i++) { total += parts[i].byteLength || 0; }
      piece.bytes = String(total);
      blob = VGenFeed.concat(parts, MSE_MIME);
      url = blob ? VGenFeed.objectUrl(blob) : "";
      if (!url) {
        row = blank(piece); row.error = "sin Blob/URL";
        finishRow(id, done)(row);
        return;
      }
      VGenFeed.revoke(lastObjectUrl);
      lastObjectUrl = url;
      say(id);
      measure(piece, url, finishRow(id, done));
    });
  } };
}

/* 8: cambio a demanda. La pieza que esta sonando se reemplaza por otra por
 * `src`; cambio_ms = pedido -> primer avance de currentTime. Es el numero que
 * el usuario siente cuando pide la ruleta. Gate: <= 1000 ms. */
function stepSwitch(id, toId) {
  return { id: id, go: function (done) {
    var to = findPiece(toId);
    var piece, row;
    if (!to) {
      piece = addExtra(fake(id, "paquete", "", "", ""));
      row = blank(piece); row.error = "no esta la pieza " + toId;
      finishRow(id, done)(row);
      return;
    }
    piece = addExtra(fake(id, "paquete", to.mime, to.file, "a " + toId));
    measure(piece, "", finishRow(id, done), {
      seconds: SWITCH_SECONDS,
      feed: function (video, r) {
        VGenFeed.switchTo(video, base + to.file, {}, function (ms) {
          r.switchMs = ms;
        });
      }
    });
  } };
}

/* Arranque previo al cambio: la pieza de la que se sale, sonando. */
function stepWarm(id, fromId) {
  return { id: id, go: function (done) {
    var from = findPiece(fromId);
    var piece, row;
    if (!from) {
      piece = addExtra(fake(id, "paquete", "", "", ""));
      row = blank(piece); row.error = "no esta la pieza " + fromId;
      finishRow(id, done)(row);
      return;
    }
    piece = addExtra(fake(id, "paquete", from.mime, from.file, "sale de " + fromId));
    measure(piece, base + from.file, finishRow(id, done), { seconds: SWITCH_SECONDS });
  } };
}

/* 99: bucle. VP9 con loop durante 60 s: cada vuelta es un seeking; un waiting
 * en la costura es un atasco. */
function stepLoop(id, pieceId) {
  return { id: id, go: function (done) {
    var src = findPiece(pieceId);
    var piece, row;
    if (!src) {
      piece = addExtra(fake(id, "paquete", "", "", ""));
      row = blank(piece); row.error = "no esta la pieza " + pieceId;
      finishRow(id, done)(row);
      return;
    }
    piece = addExtra(fake(id, "paquete", src.mime, src.file, "loop " + LOOP_SECONDS + " s"));
    measure(piece, base + src.file, finishRow(id, done),
            { seconds: LOOP_SECONDS, loop: true });
  } };
}

/* --- H-11: la capa de intervencion encima del <video> --- */

var CAPA_FPS = 15;
var capa = { load: "none", paints: 0, n: 0, timer: 0, w: 0, h: 0, k: 1 };

/* H-16: Hobo es la fuente de la capa, por defecto (operador, 2026-09-04). No
 * se puede usar `document.fonts` -devuelve Promise y el piso ES5 la prohibe-,
 * asi que la llegada de la fuente se detecta MIDIENDO: el mismo texto en
 * "Hobo, monospace" y en "monospace" dan el mismo ancho mientras la fuente no
 * haya llegado, y anchos distintos apenas llega. Se sondea hasta
 * CAPA_FUENTE_MS; si no llega, la capa sigue en monospace y cada fila lo
 * declara ("fuente: fallback"). Una medicion no puede fingir con que letra se
 * dibujo. */
var CAPA_FUENTE_MS = 3000;
var capaFuente = { name: "fallback", ms: 0, timer: 0 };
var capaRegla = null;   /* lienzo de 8x8 solo para medir; se crea una vez */

function capaFuenteFamily() {
  return capaFuente.name === "hobo" ? "\"Hobo\", monospace" : "monospace";
}

function anchoDe(texto) {
  var ctx;
  if (!capaRegla) {
    capaRegla = document.createElement("canvas");
    capaRegla.width = 8;
    capaRegla.height = 8;
  }
  ctx = capaRegla.getContext ? capaRegla.getContext("2d") : null;
  if (!ctx) { return 0; }
  ctx.font = "40px \"Hobo\", monospace";
  return ctx.measureText(texto).width;
}

/* La prueba es que la M y la i midan DISTINTO.
 *
 * Como la familia se pide siempre igual -"Hobo", monospace-, mientras la fuente
 * no haya llegado el que dibuja es monospace, y monospace le da a toda letra el
 * MISMO avance. En cuanto los dos anchos difieren, hay una fuente proporcional
 * puesta, y la unica que puede estar puesta es Hobo.
 *
 * La primera version comparaba el ancho de una frase contra el de monospace, y
 * era fragil: medido en el navegador el 2026-09-04, "ASCILINE 0123" da 285,9 px
 * en monospace y 284,4 en Hobo -1,5 px de diferencia sobre 285-, asi que en otro
 * aparato podian coincidir y la pagina hubiera dicho "fallback" para siempre
 * teniendo la fuente puesta. Con M contra i la diferencia es de 170 a 53. */
function esperarHobo() {
  var t0 = new Date().getTime();
  function mirar() {
    var ancha = anchoDe("MMMMM");
    var angosta = anchoDe("iiiii");
    var pasado = new Date().getTime() - t0;
    capaFuente.timer = 0;
    if (ancha > 0 && angosta > 0 && ancha !== angosta) {
      capaFuente.name = "hobo";
      capaFuente.ms = pasado;
      return;
    }
    if (pasado >= CAPA_FUENTE_MS) {
      capaFuente.name = "fallback";
      capaFuente.ms = pasado;
      return;
    }
    capaFuente.timer = window.setTimeout(mirar, 150);
  }
  mirar();
}

/* Panel real / superficie del WebView, tope 1. En la caja medida: 1280/3840. */
function panelScale() {
  var sw = (typeof screen !== "undefined" && screen.width) ? screen.width : 0;
  var vw = window.innerWidth || 0;
  var k = (sw > 0 && vw > 0) ? sw / vw : 1;
  return k > 1 ? 1 : k;
}

/* El buffer del canvas se dimensiona AL PANEL: el recuadro CSS del video por
 * la escala panel/superficie. Un canvas a la superficie 4K seria letal. */
function sizeCapa(cssW, cssH) {
  var node = byId("capa");
  capa.k = panelScale();
  capa.w = Math.max(1, Math.round(cssW * capa.k));
  capa.h = Math.max(1, Math.round(cssH * capa.k));
  if (node.width !== capa.w) { node.width = capa.w; }
  if (node.height !== capa.h) { node.height = capa.h; }
}

function capaContext() {
  var node = byId("capa");
  return node.getContext ? node.getContext("2d") : null;
}

/* Lo que la intervencion real dibuja: un numero, una ruleta y un texto, con
 * la API nativa de Canvas2D (INT-004). `n` avanza por pintada. */
function paintCapa(ctx, x, y, w, h, n, alpha) {
  var cx = x + w * 0.74, cy = y + h * 0.5, r = h * 0.36;
  var a = (n % 60) / 60 * Math.PI * 2;
  ctx.clearRect(x, y, w, h);
  ctx.fillStyle = "rgba(16,16,20," + alpha + ")";
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = "#ffd479";
  ctx.lineWidth = Math.max(1, h * 0.03);
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); ctx.stroke();
  ctx.fillStyle = "#ffffff";
  ctx.textBaseline = "middle";
  ctx.textAlign = "left";
  ctx.font = "bold " + Math.round(h * 0.5) + "px " + capaFuenteFamily();
  ctx.fillText(String(n % 100), x + w * 0.06, y + h * 0.42);
  ctx.font = Math.round(h * 0.16) + "px " + capaFuenteFamily();
  ctx.fillText("ASCILINE", x + w * 0.06, y + h * 0.82);
}

function capaTick() {
  var ctx;
  capa.timer = 0;
  if (capa.load !== "rect") { return; }
  ctx = capaContext();
  if (ctx) {
    capa.n++; capa.paints++;
    paintCapa(ctx, Math.round(capa.w * 0.04), Math.round(capa.h * 0.06),
              Math.round(capa.w * 0.26), Math.round(capa.h * 0.3), capa.n, 0.55);
  }
  capa.timer = window.setTimeout(capaTick, Math.round(1000 / CAPA_FPS));
}

/* load: "none" (sin canvas: display none), "rect" (rectangulo chico
 * repintado a CAPA_FPS) o "full" (pantalla completa pintada UNA vez). */
function setCapa(load) {
  var node = byId("capa"), ctx;
  if (capa.timer) { window.clearTimeout(capa.timer); capa.timer = 0; }
  capa.load = load;
  capa.paints = 0;
  node.className = load === "none" ? "off" : "";
  if (load === "none") { return; }
  ctx = capaContext();
  if (ctx) { ctx.clearRect(0, 0, capa.w, capa.h); }
  if (load === "full") {
    if (ctx) { capa.n++; capa.paints = 1; paintCapa(ctx, 0, 0, capa.w, capa.h, capa.n, 0.25); }
    return;
  }
  capaTick();
}

/* H-12b: la tecla `83` sola tiene que MOSTRAR algo. Antes solo prendia el
 * canvas: si no venia de un lote, el <video> estaba sin fuente y la caja se
 * quedaba con el cartel de play (reporte del operador, 2026-09-04). Ahora, al
 * prender la capa, si no hay nada sonando arranca la pieza base -VP9, la que
 * el operador eligio como base ese mismo dia- por el MISMO camino que el lote:
 * src + load + play, en bucle. Y si el WebView exige un gesto para reproducir,
 * el video queda en pausa: la pagina lo dice en vez de dejar al operador
 * mirando una pantalla quieta sin saber por que. */
function capaOjoPieza() {
  return findPiece("v0-vp9") || findPiece("v0-h264-baseline");
}

/* Cuanto se espera al manifiesto si el `83` se aprieta apenas abre la pagina.
 * Probado en el navegador el 2026-09-04: apretarla antes de que llegara el
 * manifiesto dejaba la capa encendida sobre un <video> vacio -el mismo sintoma
 * que el operador reporto en la caja, por otra causa-. Reintentar es mas util
 * que avisar: el operador aprieta una vez, no dos. */
var CAPA_OJO_ESPERA_MS = 6000;

function toggleCapa() {
  if (capa.load === "rect") { setCapa("none"); say("capa a ojo: apagada"); return; }
  setCapa("rect");
  capaOjoArranca(new Date().getTime());
}

function capaOjoArranca(desde) {
  var video = byId("video"), src;
  if (capa.load !== "rect") { return; }
  if (!video.currentSrc && !video.src) {
    src = capaOjoPieza();
    if (!src) {
      if (new Date().getTime() - desde < CAPA_OJO_ESPERA_MS) {
        say("capa a ojo: esperando el manifiesto");
        window.setTimeout(function () { capaOjoArranca(desde); }, 300);
      } else {
        say("capa a ojo: no llego la pieza base");
      }
      return;
    }
    stopFeeding();
    video.loop = true;
    video.src = base + src.file;
    video.load();
  }
  if (video.paused || video.ended) {
    if (video.ended) { video.currentTime = 0; }
    video.play();
  }
  window.setTimeout(function () {
    var v = byId("video");
    if (capa.load !== "rect") { return; }
    say(v.paused ? "capa a ojo: el aparato pide un gesto, aprete play"
                 : "capa a ojo: encendida sobre " + (v.currentSrc || "el video"));
  }, 900);
}

var CAPA_LOADS = [
  { n: 0, load: "none", note: "sin canvas" },
  { n: 1, load: "rect", note: "rect 15 fps" },
  { n: 2, load: "full", note: "pantalla una vez" }
];

/* Una pieza progresiva con una carga de capa; la fila dice cuantas pintadas
 * hubo y a que tamano de buffer, para saber que la capa realmente trabajo. */
function stepCapa(pieceId, short, which) {
  var id = "capa" + which.n + ":" + short;
  return { id: id, go: function (done) {
    var src = findPiece(pieceId);
    var piece, row;
    if (!src) {
      piece = addExtra(fake(id, "capa", "", "", ""));
      row = blank(piece); row.error = "no esta la pieza " + pieceId;
      finishRow(id, done)(row);
      return;
    }
    piece = addExtra(fake(id, "capa", src.mime, src.file, which.note));
    measure(piece, base + src.file, function (r) {
      if (which.load !== "none") {
        piece.note = which.note + "; pintadas " + capa.paints +
                     " (" + capa.w + "x" + capa.h + "); fuente: " +
                     capaFuente.name;
      }
      setCapa("none");
      finishRow(id, done)(r);
    }, { capa: which.load });
  } };
}

function capaSteps(pieceId, short) {
  return [stepCapa(pieceId, short, CAPA_LOADS[0]),
          stepCapa(pieceId, short, CAPA_LOADS[1]),
          stepCapa(pieceId, short, CAPA_LOADS[2])];
}

function capaAll() {
  return capaSteps("v0-h264-baseline", "base").concat(capaSteps("v0-vp9", "vp9"));
}

/* 80: todo lo que la visita de H-11 a la caja tiene que traer: las seis de
 * capa y, seguidos, blob: (mp4 clasico) y blob concat (fMP4), para comparar
 * el arranque desde memoria de los dos (1.286 ms vs 517 en H-13/H-10). */
function h11Batch() {
  return capaAll().concat(blobClassicSteps(), blobSteps());
}

function mseSteps() { return [stepMse("mse:h264", null)]; }
function blobSteps() { return [stepBlob("blob:cmaf", null)]; }
function orderSteps() {
  return [stepMse("mse:orden", swappedOrder()), stepBlob("blob:orden", swappedOrder())];
}
function switchSteps() {
  return [stepWarm("cambio0:vp9", "v0-vp9"),
          stepSwitch("cambio1:base", "v0-h264-baseline"),
          stepSwitch("cambio2:vp9", "v0-vp9"),
          stepSwitch("cambio3:base", "v0-h264-baseline")];
}
function loopSteps() { return [stepLoop("bucle:vp9", "v0-vp9")]; }

/* Las cinco pruebas de paquete, en secuencia. */
function packageSteps() {
  return mseSteps().concat(blobSteps(), orderSteps(), switchSteps(), loopSteps());
}

/* "Correr todo" es TODO: las progresivas, la de alfa, los empaquetados y las
 * pruebas de paquete, una atras de otra y en el mismo recuadro. */
function everything() {
  return pieceSteps(withRole("base").concat(withRole("alpha"), withRole("stream")))
    .concat(packageSteps(), capaAll(), cacheBatch());
}

/* H-16: lo que TODAVIA no dijo la caja. La prueba general dejo de repetir lo
 * consagrado -piezas progresivas, HLS/DASH, MSE, blob, capa, la cache que
 * persiste-: eso ya se sabe y solo tapaba pantalla. Cuando una pregunta nueva
 * entra (H-18, dos <video> a la vez), se suma aca; cuando la caja la consagra,
 * se saca y pasa al manual. */
function pendingSteps() {
  return techoSteps();
}

/* Cortar y limpiar: en una TV no hay forma comoda de recargar la pagina, asi
 * que el 0 devuelve la pantalla a cero sin salir de ella. */
function stopAll() {
  var video = byId("video");
  aborted = true;
  stopFeeding();
  video.pause();
  video.loop = false;
  setCapa("none");
  byId("alphaBg").className = "";
  byId("full").className = "";
  results = {};
  extras = [];
  say("listo");
  draw();
}

function repeatLast() {
  if (lastSteps && lastSteps.length) { runSteps(lastSteps, 0); }
}

/* --- H-12: la cache, el paquete residente en el aparato --- */

/* Lo que se guarda: las dos piezas que el producto necesita residentes (el
 * loop y el incentivador; H-13 dijo que el arranque lo mandan los bytes). Se
 * pinean por contenido (id + sha12 del manifiesto) y lo que no este en el
 * manifiesto vigente se borra al guardar. El techo se mide con ruido, no con
 * video: la pregunta es cuanto deja guardar el aparato, no que guarda. */
var CACHE_PIECES = ["v0-h264-baseline", "v0-vp9"];
/* H-12b: el techo se mide sumando tandas chicas, nunca de un salto. Mas de
 * TECHO_TANDA_MB vivos en memoria a la vez fue lo que cerro la app en la caja
 * el 2026-09-04; TECHO_TOPE_MB es hasta donde se intenta antes de dar por
 * bueno el techo (mas que eso ya no informa: el pack entero pesa menos). */
var TECHO_TANDA_MB = 5;
var TECHO_TOPE_MB = 50;
var cacheDb = null;                       /* conexion abierta, se reusa */
var cacheInfo = { says: "?", n: 0, bytes: 0, quota: "" };   /* cabecera */

function cacheOpen(cb) {
  if (cacheDb) { cb(null, cacheDb); return; }
  VGenCache.open({}, function (error, db) {
    if (!error) { cacheDb = db; }
    cb(error, db);
  });
}

function shortOf(pieceId) {
  return pieceId === "v0-h264-baseline" ? "base" : pieceId.replace(/^v0-/, "");
}

/* Cabecera del reporte: que hay guardado y cuanto lugar dice tener el aparato,
 * sin bajar nada. Se refresca al cargar y tras cada guardado o borrado: es lo
 * que, DESPUES DE REINICIAR, dice si la base persistio. */
function refreshCacheInfo(then) {
  function end() { draw(); if (then) { then(); } }
  cacheInfo.says = VGenCache.available();
  if (cacheInfo.says !== "si") { end(); return; }
  cacheOpen(function (error, db) {
    if (error) { cacheInfo.says = error; end(); return; }
    VGenCache.list(db, function (e2, rows) {
      var i, total = 0;
      if (e2) { cacheInfo.says = e2; end(); return; }
      cacheInfo.n = rows.length;
      for (i = 0; i < rows.length; i++) { total += rows[i].bytes || 0; }
      cacheInfo.bytes = total;
      VGenCache.quota({}, function (e3, used, granted) {
        if (!e3) {
          cacheInfo.quota = Math.round(used / 1048576) + "/" +
                            Math.round(granted / 1048576) + " MB";
        }
        end();
      });
    });
  });
}

function manifestKeys() {
  var keys = [], i;
  for (i = 0; i < pieces.length; i++) {
    keys.push(VGenCache.keyFor(pieces[i].id, pieces[i].sha256));
  }
  return keys;
}

function failRow(piece, id, done, why) {
  var row = blank(piece);
  row.error = why;
  finishRow(id, done)(row);
}

/* 84: bajar con progreso y guardar, pineado por contenido; despues podar lo
 * que no este en el manifiesto. La fila no reproduce nada: 1er = ms que tardo
 * el guardado; la nota lleva la bajada, los bytes y cuantas claves viejas se
 * fueron. */
function stepCacheStore(pieceId) {
  var id = "cache:guardar:" + shortOf(pieceId);
  return { id: id, go: function (done) {
    var src = findPiece(pieceId);
    var piece, row;
    if (!src) {
      failRow(addExtra(fake(id, "cache", "", "", "")), id, done,
              "no esta la pieza " + pieceId);
      return;
    }
    piece = addExtra(fake(id, "cache", src.mime, src.file, "guardar"));
    row = blank(piece);
    row.noVideo = true;
    cacheOpen(function (error, db) {
      if (error) { row.error = error; finishRow(id, done)(row); return; }
      VGenCache.download(base + src.file, {
        onProgress: function (loaded, total) {
          say("bajando " + pieceId + " " +
              (total ? Math.round(loaded * 100 / total) + " %"
                     : Math.round(loaded / 1024) + " KB"));
        }
      }, function (e2, bytes, downloadMs) {
        var t0;
        if (e2) { row.error = e2; finishRow(id, done)(row); return; }
        say("guardando " + pieceId);
        t0 = new Date().getTime();
        VGenCache.put(db, {
          key: VGenCache.keyFor(src.id, src.sha256), id: src.id,
          sha: src.sha256, mime: src.mime, bytes: bytes.byteLength,
          data: bytes, at: t0
        }, function (e3) {
          var putMs = new Date().getTime() - t0;
          if (e3) {
            row.error = "guardar: " + e3;
            piece.note = "no entro; " + bytes.byteLength + " B; " + putMs + " ms";
            finishRow(id, done)(row);
            return;
          }
          row.started = true;
          row.firstMs = putMs;
          piece.bytes = String(bytes.byteLength);
          VGenCache.prune(db, manifestKeys(), function (e4, removed) {
            piece.note = "bajada " + downloadMs + " ms; guardado " + putMs +
                         " ms; " + bytes.byteLength + " B" +
                         (removed.length ? "; borradas " + removed.length + " viejas" : "");
            refreshCacheInfo(function () { finishRow(id, done)(row); });
          });
        });
      });
    });
  } };
}

/* 85: reproducir desde la cache, sin red. Es la tecla de DESPUES DE REINICIAR:
 * si la fila dice "no esta", IndexedDB no persistio en este aparato. 1er =
 * arranque desde blob: (gate <= 1 s), comparable con blob: y blob concat. */
function stepCachePlay(pieceId) {
  var id = "cache:" + shortOf(pieceId);
  return { id: id, go: function (done) {
    var src = findPiece(pieceId);
    var piece;
    if (!src) {
      failRow(addExtra(fake(id, "cache", "", "", "")), id, done,
              "no esta la pieza " + pieceId);
      return;
    }
    piece = addExtra(fake(id, "cache", src.mime, src.file, "desde cache"));
    cacheOpen(function (error, db) {
      if (error) { failRow(piece, id, done, error); return; }
      VGenCache.get(db, VGenCache.keyFor(src.id, src.sha256), function (e2, record) {
        var blob, url;
        if (e2) { failRow(piece, id, done, "leer: " + e2); return; }
        if (!record) {
          failRow(piece, id, done,
                  "no esta en la cache (84 la guarda; si ya estaba, no persistio)");
          return;
        }
        blob = VGenFeed.concat([record.data], src.mime);
        url = blob ? VGenFeed.objectUrl(blob) : "";
        if (!url) { failRow(piece, id, done, "sin Blob/URL"); return; }
        VGenFeed.revoke(lastObjectUrl);
        lastObjectUrl = url;
        piece.bytes = String(record.bytes || 0);
        piece.note = "desde cache; " + (record.bytes || 0) + " B";
        say(id);
        measure(piece, url, finishRow(id, done));
      });
    });
  } };
}

/* El techo, en TANDAS CHICAS y acumulativas.
 *
 * La version anterior armaba 10, 25 y 50 MB de ruido de una sola vez, y en la
 * caja la de 50 MB CERRO LA APP. Eso no era el aparato diciendo su techo: era
 * esta prueba pidiendole 50 MB contiguos y ademas clonandolos para guardarlos.
 * El techo se mide sumando, no de un salto: tandas de TECHO_TANDA_MB, una por
 * vez, y nunca mas de una viva en memoria.
 *
 * Y antes de escribir un solo byte se reporta la CUOTA DECLARADA: ese es el
 * primer techo, el unico que el aparato dice sin que haya que empujarlo. Si la
 * escritura corta antes, el nombre del error (QuotaExceededError) es la
 * respuesta, no una falla de la pagina. Todo se borra al terminar, entre o no,
 * para no comerle lugar al pack. */
function stepTecho() {
  var id = "cache:techo";
  return { id: id, go: function (done) {
    var piece = addExtra(fake(id, "cache", "", "",
                              "tandas de " + TECHO_TANDA_MB + " MB"));
    var row = blank(piece);
    row.noVideo = true;
    VGenCache.quota({}, function (qError, used, granted) {
      piece.note = "declara " + (qError ? qError :
                   (Math.round(used / 1048576) + "/" +
                    Math.round(granted / 1048576) + " MB")) +
                   "; tandas de " + TECHO_TANDA_MB + " MB";
      cacheOpen(function (error, db) {
        var puestas = 0, t0;
        if (error) { row.error = error; finishRow(id, done)(row); return; }
        t0 = new Date().getTime();

        /* Borra lo escrito, una por una, y recien ahi cierra la fila. */
        function limpiar() {
          var i = 0;
          function siguiente() {
            if (i >= puestas) {
              refreshCacheInfo(function () { finishRow(id, done)(row); });
              return;
            }
            i++;
            VGenCache.remove(db, "techo." + i, siguiente);
          }
          siguiente();
        }

        function tanda() {
          var data, entraron = puestas * TECHO_TANDA_MB;
          if (entraron >= TECHO_TOPE_MB) {
            piece.note += "; entraron " + entraron + " MB (tope de la prueba)";
            row.started = true;
            row.firstMs = new Date().getTime() - t0;
            limpiar();
            return;
          }
          say("techo: tanda " + (puestas + 1) + ", acumula " +
              (entraron + TECHO_TANDA_MB) + " MB");
          data = VGenCache.noise(TECHO_TANDA_MB);
          if (!data) {
            row.error = "sin ruido de " + TECHO_TANDA_MB + " MB (el modulo da hasta " +
                        VGenCache.TANDA_MB + ")";
            limpiar();
            return;
          }
          VGenCache.put(db, { key: "techo." + (puestas + 1), id: "techo",
                              sha: "", mime: "", bytes: data.byteLength,
                              data: data, at: new Date().getTime() },
            function (e2) {
              data = null;
              if (e2) {
                piece.note += "; entraron " + entraron + " MB, corto en " + e2;
                row.error = e2;
                limpiar();
                return;
              }
              puestas++;
              tanda();
            });
        }
        tanda();
      });
    });
  } };
}

function cacheStoreSteps() {
  var out = [], i;
  for (i = 0; i < CACHE_PIECES.length; i++) { out.push(stepCacheStore(CACHE_PIECES[i])); }
  return out;
}

function cachePlaySteps() {
  var out = [], i;
  for (i = 0; i < CACHE_PIECES.length; i++) { out.push(stepCachePlay(CACHE_PIECES[i])); }
  return out;
}

function techoSteps() {
  return [stepTecho()];
}

/* 84: guardar las dos piezas, reproducirlas desde la cache y medir el techo:
 * todo lo que la visita de H-12 tiene que traer antes de reiniciar. */
function cacheBatch() {
  return cacheStoreSteps().concat(cachePlaySteps(), techoSteps());
}

/* 86: vaciar la base. Tambien prueba que se puede limpiar desde la TV. */
function clearCache() {
  cacheOpen(function (error, db) {
    if (error) { say("cache: " + error); return; }
    VGenCache.clear(db, function (e2) {
      say(e2 ? "borrar: " + e2 : "cache vacia");
      refreshCacheInfo();
    });
  });
}

/* blob: es el piso de la cache (bajar una vez y reproducir sin red). Se prueba
 * con la primera pieza progresiva. Devuelve el paso para poder encadenarlo
 * (el 80 lo corre seguido del blob concat). */
function blobClassicSteps() {
  var list = baseOnly();
  var piece, id;
  if (!list.length) { return []; }
  piece = list[0];
  id = "blob:" + piece.id;
  return [{ id: id, go: function (done) {
    var row;
    var extra = addExtra(fake(id, "blob", piece.mime, "(blob)", ""));
    extra.bytes = piece.bytes;
    say("bajando a memoria: " + piece.id);
    VGenFeed.getBytes(base + piece.file, function (error, bytes) {
      var blob, url;
      if (error) {
        row = blank(extra); row.error = error;
        finishRow(id, done)(row);
        return;
      }
      blob = VGenFeed.concat([bytes], piece.mime);
      url = blob ? VGenFeed.objectUrl(blob) : "";
      if (!url) {
        row = blank(extra); row.error = "sin Blob/URL";
        finishRow(id, done)(row);
        return;
      }
      VGenFeed.revoke(lastObjectUrl);
      lastObjectUrl = url;
      say("blob: " + piece.id);
      measure(extra, url, finishRow(id, done));
    });
  } }];
}

function runBlob() { runSteps(blobClassicSteps(), 0); }

/* En una TV no se puede copiar texto: el reporte se lee a pantalla completa y
 * se saca una foto. Por eso ocupa todo y con tipografia grande. */
function toggleReport() {
  var full = byId("full");
  full.className = full.className === "on" ? "" : "on";
}

/* Mando numerico. El destino es un TV BOX con control remoto: el click ahi es
 * caro y las teclas numericas son gratis.
 *
 * DOS CIFRAS COMO TECHO (decision del operador, 2026-09-02): antes de llegar a
 * tres cifras hay cien numeros. Lo comun cae en un digito suelto y dispara al
 * instante; lo demas vive detras de una PUERTA, y hay dos: el 9 (secundario ya
 * medido, sin accion propia) y el 8 (la capa de H-11; conserva su accion, asi
 * que el 8 solo espera 900 ms u OK antes de correr "cambio a demanda"). El
 * retardo se ajusta con ?delay=<ms>.
 *
 * Cada tecla declara ademas su TIER, que es lo que la leyenda usa para elegir
 * el tamano: "now" = lo que hay que probar en esta visita (grande y arriba),
 * "tool" = herramientas de siempre, "done" = lo ya medido (chico y apagado).
 * El tamano es el mensaje: el operador tiene que ver de un vistazo que se le
 * esta pidiendo, y todo tiene que entrar sin pisar el zocalo. */
var TECLAS = [
  { code: "80", label: "lote capa", tier: "now",
    detail: "H-11: capa x6 + blob: + blob concat",
    run: function () { runSteps(h11Batch(), 0); } },
  { code: "81", label: "capa / baseline", tier: "now",
    detail: "sin, rect 15 fps, pantalla",
    run: function () { runSteps(capaSteps("v0-h264-baseline", "base"), 0); } },
  { code: "82", label: "capa / vp9", tier: "now",
    detail: "sin, rect 15 fps, pantalla",
    run: function () { runSteps(capaSteps("v0-vp9", "vp9"), 0); } },
  { code: "83", label: "capa a ojo", tier: "now",
    detail: "prende el rect; si no hay nada sonando, arranca VP9 en bucle",
    run: toggleCapa },
  { code: "84", label: "cache: guardar", tier: "now",
    detail: "H-12: baja y guarda baseline + vp9, las reproduce desde ahi y mide el techo en tandas de 5 MB",
    run: function () { runSteps(cacheBatch(), 0); } },
  { code: "85", label: "desde cache", tier: "now",
    detail: "tras REINICIAR la caja: siguen ahi? arranque sin red",
    run: function () { runSteps(cachePlaySteps(), 0); } },
  { code: "86", label: "borrar cache", tier: "now",
    detail: "vacia la base",
    run: clearCache },
  /* H-16: el `1` corre SOLO LO NO CONSAGRADO (operador, 2026-09-04: "si ya
   * tuvimos claridad sobre ciertos elementos, ya quitalos de la prueba
   * general"). Hoy es el techo de la cache; crece cuando H-18 exista. Lo ya
   * consagrado no desaparece: va en el 89 y en el manual. */
  { code: "1", label: "lo que falta", tier: "now",
    detail: "solo lo NO consagrado: hoy, el techo de la cache",
    run: function () { runSteps(pendingSteps(), 0); } },
  { code: "95", label: "reporte", tier: "tool",
    detail: "a pantalla completa, para la foto",
    run: toggleReport },
  { code: "93", label: "repetir", tier: "tool",
    detail: "la ultima corrida otra vez",
    run: repeatLast },
  { code: "0", label: "cortar", tier: "tool",
    detail: "vuelve la pantalla a cero",
    run: stopAll },
  /* El lanzador vive en OTRO servidor (es un archivo suelto), asi que no se
   * puede linkear a una ruta fija: se vuelve con el historial, y ?ir=<url>
   * permite apuntarlo si algun dia conviene. */
  { code: "94", label: "volver", tier: "tool",
    detail: "al lanzador, o atras en el historial",
    run: function () {
      if (param("ir")) { window.location.href = param("ir"); }
      else if (window.history && window.history.back) { window.history.back(); }
    } },
  { code: "2", label: "progresivas", tier: "done",
    detail: "las 3 piezas sueltas",
    run: function () { runSteps(pieceSteps(baseOnly()), 0); } },
  { code: "3", label: "alfa", tier: "done",
    detail: "transparencia sobre fondo verde",
    run: function () { runSteps(pieceSteps(withRole("alpha")), 0); } },
  { code: "4", label: "HLS / DASH", tier: "done",
    detail: "los 3 empaquetados",
    run: function () { runSteps(pieceSteps(withRole("stream")), 0); } },
  { code: "5", label: "paquete (5)", tier: "done",
    detail: "MSE, Blob, orden, cambio, bucle",
    run: function () { runSteps(packageSteps(), 0); } },
  { code: "6", label: "solo main", tier: "done",
    detail: "H.264 Main (detector de hardware)",
    run: function () { runOnly("v0-h264-main"); } },
  { code: "7", label: "solo vp9", tier: "done",
    detail: "VP9 progresivo",
    run: function () { runOnly("v0-vp9"); } },
  { code: "8", label: "cambio", tier: "done",
    detail: "VP9 > Baseline > VP9 > Baseline; espera 900 ms u OK (es puerta)",
    run: function () { runSteps(switchSteps(), 0); } },
  { code: "90", label: "hls-fmp4", tier: "done", detail: "HLS CMAF",
    run: function () { runOnly("v0-hls-fmp4"); } },
  { code: "91", label: "dash", tier: "done", detail: "DASH",
    run: function () { runOnly("v0-dash"); } },
  { code: "92", label: "blob:", tier: "done", detail: "reproducir desde memoria",
    run: runBlob },
  { code: "96", label: "MSE h264", tier: "done",
    detail: "init + 16 segmentos por SourceBuffer",
    run: function () { runSteps(mseSteps(), 0); } },
  { code: "97", label: "blob concat", tier: "done",
    detail: "init + 16 segmentos en un Blob",
    run: function () { runSteps(blobSteps(), 0); } },
  { code: "98", label: "orden", tier: "done",
    detail: "1-8,13-16,9-12 por MSE y por Blob",
    run: function () { runSteps(orderSteps(), 0); } },
  { code: "99", label: "bucle 60 s", tier: "done", detail: "VP9 con loop",
    run: function () { runSteps(loopSteps(), 0); } },
  { code: "89", label: "correr todo", tier: "done",
    detail: "v0 entero + paquete + capa + cache, incluido lo consagrado",
    run: function () { runSteps(everything(), 0); } }
];

/* La leyenda se dibuja por tier, no en el orden del arreglo: primero lo que hay
 * que probar, despues las herramientas.
 *
 * H-16: el tier "done" -lo que la caja YA consagro- dejo de dibujarse. Las
 * teclas siguen andando igual: lo unico que cambia es que no compiten por la
 * pantalla. Estan listadas en docs/MANUAL-TECLAS-V0.md, que es lo que el
 * operador pidio: "en vez de darme todas las opciones en pantalla largame un
 * archivo manual donde yo desde la pc pueda saber que aprieto". */
/* Los tres tiers existen para clasificar; solo estos dos se dibujan. */
var TIERS_VISIBLES = ["now", "tool"];

function renderKeys() {
  var box = byId("teclas");
  var t, i, item, row, tag, name;
  while (box.firstChild) { box.removeChild(box.firstChild); }
  for (t = 0; t < TIERS_VISIBLES.length; t++) {
    for (i = 0; i < TECLAS.length; i++) {
      item = TECLAS[i];
      if ((item.tier || "done") !== TIERS_VISIBLES[t]) { continue; }
      row = document.createElement("div");
      row.className = "op " + TIERS_VISIBLES[t];
      tag = document.createElement("span");
      tag.className = "n";
      text(tag, item.code);
      row.appendChild(tag);
      name = document.createElement("span");
      text(name, item.label);
      row.appendChild(name);
      /* La misma leyenda es el boton: en el celular y en el escritorio se toca,
       * en la TV se aprieta el numero. Una sola interfaz para los dos mundos. */
      row.onclick = (function (action) {
        return function () { if (action.run) { action.run(); } };
      })(item);
      box.appendChild(row);
    }
  }
}

function start() {
  layout();
  base = param("base");
  if (base && base.charAt(base.length - 1) !== "/") { base += "/"; }
  renderKeys();
  esperarHobo();
  draw();
  refreshCacheInfo();
  if (window.ASCLKeypad) {
    ASCLKeypad.create({
      delay: param("delay") ? parseInt(param("delay"), 10) : 900,
      actions: TECLAS,
      onBuffer: function (buffer) {
        text(byId("buffer"), buffer ? buffer + "_" : "");
      }
    });
  }
  get(base + "MANIFEST.tsv", function (body) {
    pieces = parseManifest(body);
    say("listo - " + pieces.length + " piezas");
    draw();
  }, function (why) {
    say("no se pudo leer MANIFEST.tsv: " + why);
  });
}

window.onresize = layout;
start();
</script>
</body>
