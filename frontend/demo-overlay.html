<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCILINE demo overlay</title>
<!--
  DEMO DE LABORATORIO (no es el runtime F7, que llega en S-5).
  Prueba el mecanismo central de INT-001 sobre un clip real: los glifos
  horneados por E-06 se escriben como INDICES sobre la matriz de celdas del
  reader (un solo layer, jamas un segundo canvas), y las celdas originales se
  restauran tras cada draw para no romper la cadena DELTA.
  Como el clip de referencia se encodeo con reserved=0, los colores del glifo
  se mapean al indice mas cercano de la paleta vigente de cada epoca; con
  reserved=10 esos indices serian fijos (246..255).
-->
<style>
  :root{ color-scheme: dark; }
  body{ margin:0; background:#0d0d10; color:#e7e7ea; font:14px/1.5 system-ui,sans-serif; }
  header{ padding:10px 16px; border-bottom:1px solid #26262c; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  h1{ font-size:15px; margin:0 12px 0 0; }
  select,button{ background:#1a1a20; color:#e7e7ea; border:1px solid #33333c; border-radius:6px; padding:6px 9px; font:inherit; cursor:pointer; }
  #stage{ display:flex; justify-content:center; padding:14px; }
  canvas{ background:#000; max-width:100%; image-rendering:pixelated; border:1px solid #26262c; }
  #status{ padding:8px 16px; color:#8a8a92; font-family:ui-monospace,monospace; font-size:12px; }
  .pill{ padding:2px 8px; border-radius:999px; background:#1a1a20; border:1px solid #33333c; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>ASCILINE &middot; demo overlay (laboratorio)</h1>
  <label>zoom <select id="zoom"><option selected>1</option><option>2</option></select></label>
  <button id="play" disabled>Play</button>
  <span id="badge" class="pill">cargando...</span>
</header>
<div id="stage"><canvas id="cv" width="320" height="180"></canvas></div>
<div id="status">Demo: numeros "en vivo" escritos sobre la matriz de celdas con los glifos horneados de E-06.</div>
<audio id="audio" style="display:none"></audio>

<script src="inflate.js"></script>
<script src="reader.js"></script>
<script src="reader-v2.js"></script>
<script src="reader-factory.js"></script>
<script src="render-canvas2d.js"></script>
<script src="render-webgl.js"></script>
<script>
(function(){
  "use strict";
  var GLYPH_W=8, GLYPH_H=12, GLYPH_AREA=GLYPH_W*GLYPH_H;
  var GLYPHS=[246,246,246,246,246,246,246,246,246,246,247,249,249,247,246,246,246,247,251,249,249,251,247,246,246,249,249,246,246,250,249,246,246,250,248,246,246,248,250,246,246,250,248,248,248,248,250,246,246,250,248,249,248,248,250,246,246,250,248,246,246,249,250,246,246,249,250,246,246,250,248,246,246,247,251,249,249,251,246,246,246,246,247,248,248,247,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,247,248,248,246,246,246,246,247,250,250,251,246,246,246,246,246,246,247,251,246,246,246,246,246,246,247,251,246,246,246,246,246,246,247,251,246,246,246,246,246,246,247,251,246,246,246,246,246,246,247,251,246,246,246,246,246,246,247,251,246,246,246,246,246,249,249,251,249,248,246,246,246,248,248,248,248,248,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,248,249,248,246,246,246,246,249,250,249,250,251,247,246,246,247,246,246,246,250,248,246,246,246,246,246,246,250,248,246,246,246,246,246,247,251,247,246,246,246,246,247,251,248,246,246,246,246,246,250,248,246,246,246,246,246,250,249,246,246,246,246,246,249,251,249,249,249,248,246,246,248,249,249,249,249,248,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,247,249,249,249,247,246,246,246,248,249,248,249,251,247,246,246,246,246,246,246,250,248,246,246,246,246,246,246,250,248,246,246,246,247,250,251,249,246,246,246,246,246,247,248,251,247,246,246,246,246,246,246,249,249,246,246,246,246,246,246,249,249,246,246,250,249,249,250,251,247,246,246,247,248,249,248,247,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,247,248,246,246,246,246,246,247,251,250,246,246,246,246,246,249,249,250,246,246,246,246,248,249,248,250,246,246,246,246,250,247,248,250,246,246,246,249,248,246,248,250,246,246,246,251,249,249,250,251,249,246,246,248,248,248,249,251,248,246,246,246,246,246,248,250,246,246,246,246,246,246,247,248,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,247,249,249,249,249,246,246,246,248,251,249,249,249,246,246,246,248,250,246,246,246,246,246,246,248,250,249,248,246,246,246,246,248,249,249,250,251,247,246,246,246,246,246,246,250,249,246,246,246,246,246,246,249,249,246,246,246,246,246,246,250,249,246,246,250,250,250,251,250,246,246,246,247,248,248,247,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,249,249,248,246,246,246,246,250,249,248,249,247,246,246,248,250,246,246,246,246,246,246,250,248,248,248,247,246,246,246,250,250,249,249,251,247,246,246,250,249,246,246,249,250,246,246,250,248,246,246,248,250,246,246,249,249,246,246,249,250,246,246,247,251,249,249,251,247,246,246,246,247,248,248,247,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,248,248,248,248,248,247,246,246,249,249,249,249,250,249,246,246,246,246,246,246,251,247,246,246,246,246,246,248,250,246,246,246,246,246,246,250,248,246,246,246,246,246,247,251,246,246,246,246,246,246,249,249,246,246,246,246,246,246,251,247,246,246,246,246,246,248,251,246,246,246,246,246,246,247,247,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,247,249,249,247,246,246,246,248,251,248,248,251,248,246,246,249,249,246,246,249,249,246,246,248,250,246,246,250,248,246,246,246,249,250,250,249,246,246,246,248,250,248,248,250,248,246,246,250,248,246,246,248,250,246,246,250,248,246,246,248,250,246,246,248,251,249,249,251,248,246,246,246,247,248,248,247,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,246,248,249,249,247,246,246,246,248,251,248,249,251,247,246,246,250,248,246,246,249,249,246,246,250,248,246,246,249,250,246,246,250,249,246,246,250,250,246,246,247,251,250,250,250,250,246,246,246,247,248,247,248,249,246,246,246,246,246,246,250,248,246,246,247,249,249,250,250,246,246,246,246,248,249,248,246,246,246,246,246,246,246,246,246,246,246,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255,255];

  var cv=document.getElementById("cv"), audio=document.getElementById("audio");
  var elPlay=document.getElementById("play"), elZoom=document.getElementById("zoom");
  var elBadge=document.getElementById("badge"), elStatus=document.getElementById("status");
  var reader=null, renderer=null, playing=false, hasAudio=false;
  var startT=0, raf=0, lastShown=-1;
  var urlAPI=window.URL || window.webkitURL;
  var perf=window.performance;
  var now=(perf && typeof perf.now==="function")?function(){return perf.now();}:function(){return new Date().getTime();};
  var requestFrame=window.requestAnimationFrame||function(fn){return window.setTimeout(function(){fn(now());},16);};
  var cancelFrame=window.cancelAnimationFrame||window.clearTimeout;
  function log(s){ elStatus.textContent=s; }

  /* ---- overlay: mapeo de niveles de glifo a la paleta vigente ---- */
  var mapPal=null, mapFor=null;
  var LEVEL_RGB=[[16,16,30],[64,64,74],[113,113,124],[161,161,173],[209,209,220],[255,255,255]];
  function nearestIndex(pal, count, rgb){
    var best=0, bestD=0x7fffffff, i, dr, dg, db, d;
    for(i=0;i<count;i++){
      dr=pal[i*3]-rgb[0]; dg=pal[i*3+1]-rgb[1]; db=pal[i*3+2]-rgb[2];
      d=dr*dr+dg*dg+db*db;
      if(d<bestD){ bestD=d; best=i; }
    }
    return best;
  }
  function levelMap(){
    if(mapFor===reader.palette && mapPal) return mapPal;
    var count=reader.paletteEntries||(reader.palette.length/3), i;
    mapPal=[];
    for(i=0;i<6;i++) mapPal[i]=nearestIndex(reader.palette,count,LEVEL_RGB[i]);
    mapFor=reader.palette;
    return mapPal;
  }

  /* dos campos de dos digitos, abajo a la derecha */
  function fieldValues(frame){
    var second=Math.floor(frame/reader.header.fps);
    return [ (second*7+13)%100, (second*31+42)%100 ];
  }
  var undoIdx=[], undoVal=[];
  function stampGlyph(cells, cols, rows, digit, x0, y0, map){
    var g=digit*GLYPH_AREA, gy, gx, v, idx;
    for(gy=0;gy<GLYPH_H;gy++){
      for(gx=0;gx<GLYPH_W;gx++){
        v=GLYPHS[g+gy*GLYPH_W+gx];
        if(v===255) continue;              /* transparente: pasa el video */
        idx=(y0+gy)*cols+(x0+gx);
        undoIdx.push(idx); undoVal.push(cells[idx]);
        cells[idx]=map[v-246];
      }
    }
  }
  function stampOverlay(frame){
    var h=reader.header, cols=h.cols, rows=h.rows, cells=reader.cells;
    var map=levelMap(), values=fieldValues(frame);
    var baseY=rows-GLYPH_H-6, x=cols-(4*GLYPH_W+3*2+8), i, v;
    undoIdx.length=0; undoVal.length=0;
    for(i=0;i<2;i++){
      v=values[i];
      stampGlyph(cells,cols,rows,Math.floor(v/10),x,baseY,map);
      x+=GLYPH_W+2;
      stampGlyph(cells,cols,rows,v%10,x,baseY,map);
      x+=GLYPH_W+2;
    }
    reader.dirtyFull=true;
  }
  function restoreOverlay(){
    var cells=reader.cells, i;
    for(i=undoIdx.length-1;i>=0;i--) cells[undoIdx[i]]=undoVal[i];
  }
  function drawWithOverlay(frame){
    stampOverlay(frame);
    renderer.draw(reader);
    restoreOverlay();
  }

  /* ---- player minimo (mismo esqueleto que player.html) ---- */
  function pickRenderer(){
    var old=cv, nc=document.createElement("canvas");
    nc.id="cv"; old.parentNode.replaceChild(nc,old); cv=nc;
    var cellPx=parseInt(elZoom.value,10), r=null;
    try{ var w=new window.WebGLRenderer(cv); r=w.init(reader,cellPx,"nearest")?w:null; }catch(err){ r=null; }
    if(!r){ r=new window.Canvas2DRenderer(cv); r.init(reader,cellPx,"nearest"); }
    renderer=r;
  }
  function openAscl(buf,off,len){
    var api=window.ASCILINEReader||window.ASCL;
    reader=api.parse(buf,off,len);
    pickRenderer();
    reader.decodedIndex=-1; reader.seek(0); drawWithOverlay(0); lastShown=0;
    elPlay.disabled=false;
    var h=reader.header;
    elBadge.textContent="ASCL v"+h.version+" "+h.cols+"x"+h.rows+" @"+h.fps+"fps";
    log("Overlay demo activo: 2 campos de 2 digitos (glifos E-06) escritos sobre la matriz. "+
        "Las celdas se restauran tras cada frame: la cadena DELTA queda intacta.");
  }
  function loadBundle(buf){
    var dv=new DataView(buf);
    var asclLen=dv.getUint32(8,true), audioLen=dv.getUint32(12,true);
    if(asclLen<32||16+asclLen+audioLen!==buf.byteLength){ throw new Error("bundle invalido"); }
    if(audioLen>0 && urlAPI && urlAPI.createObjectURL){
      var blob=new Blob([new Uint8Array(buf,16+asclLen,audioLen)],{type:"audio/mpeg"});
      audio.src=urlAPI.createObjectURL(blob);
      audio.onended=function(){ stop(); };
      hasAudio=true;
    }
    openAscl(buf,16,asclLen);
  }
  function frameNow(){
    var t=hasAudio?audio.currentTime:(now()-startT)/1000;
    return Math.floor(t*reader.header.fps);
  }
  function loop(){
    if(!playing) return;
    var target=frameNow(), n=reader.header.nFrames;
    if(target>=n){ if(hasAudio){ target=n-1; } else { stop(); return; } }
    if(target!==lastShown){
      reader.seek(target);
      drawWithOverlay(target);
      lastShown=target;
    }
    raf=requestFrame(loop);
  }
  function start(){
    playing=true; elPlay.textContent="Pause";
    startT=now()-(lastShown/reader.header.fps)*1000;
    if(hasAudio){ audio.play(); }
    raf=requestFrame(loop);
  }
  function stop(){ playing=false; elPlay.textContent="Play"; if(raf) cancelFrame(raf); if(hasAudio) audio.pause(); }
  elPlay.onclick=function(){ playing?stop():start(); };
  elZoom.onchange=function(){ if(reader){ pickRenderer(); reader.decodedIndex=-1; reader.seek(lastShown<0?0:lastShown); drawWithOverlay(lastShown<0?0:lastShown); } };

  var x=new XMLHttpRequest();
  x.open("GET","../outputs/clip.asclv",true); x.responseType="arraybuffer";
  x.onload=function(){ try{ loadBundle(x.response); }catch(err){ log("Error: "+err.message); } };
  x.onerror=function(){ log("No se pudo cargar ../outputs/clip.asclv (servir por HTTP)."); };
  x.send();
})();
</script>
</body>
</html>
