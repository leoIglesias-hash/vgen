<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ASCILINE TV</title>
<style>
  html,body{ width:100%; height:100%; margin:0; overflow:hidden; background:#000; }
  body{ color:#fff; font-family:Arial,Helvetica,sans-serif; }
  #stage{ position:absolute; left:0; top:0; right:0; bottom:0; overflow:hidden;
    background:#000; cursor:pointer; outline:none; }
  #cv{ position:absolute; left:50%; top:50%; display:block; margin:0; border:0;
    background:#000; image-rendering:auto; -ms-interpolation-mode:bicubic; }
  #message{ position:absolute; z-index:2; left:0; right:0; bottom:7%; text-align:center;
    pointer-events:none; }
  #panel{ display:inline-block; max-width:82%; padding:14px 22px; color:#fff;
    background:#000; background:rgba(0,0,0,.72); border:1px solid #555;
    font-size:22px; line-height:1.35; }
  #detail{ display:block; padding-top:5px; color:#bbb; font-size:14px; }
  #download{ position:absolute; z-index:4; right:10px; top:10px; padding:7px 11px;
    border:1px solid #666; color:#ddd; background:#111; background:rgba(12,12,12,.82);
    font:13px Arial,Helvetica,sans-serif; cursor:pointer; }
  #download:focus{ border-color:#fff; color:#fff; outline:2px solid #777; }
  #techHotspot{ position:absolute; z-index:7; left:8px; bottom:8px; width:58px; height:30px;
    padding:0; border:1px solid #666; border-color:rgba(255,255,255,.28); color:#ddd;
    background:#222; background:rgba(20,20,20,.42); opacity:.52; filter:alpha(opacity=52);
    font:bold 10px Arial,Helvetica,sans-serif; letter-spacing:1px; cursor:pointer; }
  #techHotspot:hover,#techHotspot:focus,#techHotspot.active{ color:#fff; opacity:.95;
    filter:alpha(opacity=95); background:#222; background:rgba(20,20,20,.82);
    outline:1px solid #aaa; }
  #techMenu{ display:none; position:absolute; z-index:8; left:10px; bottom:10px;
    width:310px; max-width:82%; padding:13px; color:#ddd;
    background:#111; background:rgba(12,12,12,.88); border:1px solid #666;
    font:13px/1.35 Arial,Helvetica,sans-serif; }
  #techMenu.open{ display:block; }
  #techTitle{ margin-bottom:9px; color:#fff; font-size:15px; }
  #refreshVideo,#closeTechMenu{ display:block; box-sizing:border-box; width:100%;
    margin:0 0 8px; padding:9px; border:1px solid #777; color:#fff;
    background:#222; font:13px Arial,Helvetica,sans-serif; cursor:pointer; }
  #refreshVideo:focus,#closeTechMenu:focus{ outline:2px solid #aaa; }
  #techNote{ color:#aaa; }
  .playing #message{ display:none; }
  .error #panel{ border-color:#b33; color:#ffd8d8; }
</style>
</head>
<body>
<div id="stage" tabindex="0" role="button" aria-label="Iniciar video en pantalla completa">
  <canvas id="cv" width="640" height="360"></canvas>
  <button id="download" type="button">Iniciar descarga</button>
  <div id="message"><div id="panel">
    <span id="headline">Cargando video&hellip;</span>
    <span id="detail">ASCILINE TV</span>
  </div></div>
</div>
<button id="techHotspot" type="button" aria-label="Abrir menu tecnico" title="Menu tecnico">MENU</button>
<div id="techMenu" role="dialog" aria-label="Actualizacion del video" aria-hidden="true">
  <div id="techTitle">Actualizaci&oacute;n del video</div>
  <button id="refreshVideo" type="button">Limpiar cach&eacute; / descargar de nuevo</button>
  <button id="closeTechMenu" type="button">Ocultar men&uacute;</button>
  <div id="techNote">Renueva solamente este archivo ASCLV. No borra la cach&eacute; global del TV.</div>
</div>
<audio id="audio" preload="auto" style="display:none"></audio>

<script src="inflate.js"></script>
<script src="reader.js"></script>
<script src="reader-v2.js"></script>
<script src="reader-factory.js"></script>
<script src="render-canvas2d.js"></script>
<script src="render-webgl.js"></script>
<script src="tv-controller.js"></script>
<script src="cache-refresh.js"></script>
<script>
(function(){
  "use strict";

  /* Ruta relativa del servidor PHP. El archivo local conserva su nombre original. */
  var DEFAULT_SRC="./outputs/clip.asclv";
  /* CACHE-001 (F6-4): puntero mutable hacia el clip versionado inmutable */
  var POINTER_DIR="./outputs/";
  var POINTER_SRC=POINTER_DIR+"clip.current.txt";
  var FLAG_RECON_SOFT=16;
  var stage=document.getElementById("stage");
  var cv=document.getElementById("cv");
  var audio=document.getElementById("audio");
  var downloadButton=document.getElementById("download");
  var techHotspot=document.getElementById("techHotspot");
  var techMenu=document.getElementById("techMenu");
  var refreshVideoButton=document.getElementById("refreshVideo");
  var closeTechMenuButton=document.getElementById("closeTechMenu");
  var headline=document.getElementById("headline");
  var detail=document.getElementById("detail");
  var reader=null, renderer=null, ready=false, playing=false, hasAudio=false;
  var lastShown=-1, startT=0, raf=0, rendererName="";
  var activeReconstruction="nearest";
  var rendererEventCanvas=null, rendererContextLostHandler=null;
  var rendererEventLegacy=false;
  var audioObjectURL=null;
  var activeXHR=null;
  var lastDownloadTouch=-1;
  var techMenuVisible=false;
  var cacheStorage=null;
  var urlAPI=window.URL || window.webkitURL;
  var perf=window.performance;
  var now=(perf && typeof perf.now==="function") ?
    function(){ return perf.now(); } :
    function(){ return Date.now ? Date.now() : new Date().getTime(); };
  /* W-14: requestFrame/cancelFrame se eligen como PAR. Mezclar rAF nativo con
     clearTimeout deja frames imposibles de cancelar; los nativos se invocan
     con window como receptor para evitar Illegal invocation en WebViews. */
  var nativeRequestFrame=window.requestAnimationFrame || window.webkitRequestAnimationFrame ||
    window.mozRequestAnimationFrame || window.msRequestAnimationFrame;
  var nativeCancelFrame=window.cancelAnimationFrame || window.webkitCancelAnimationFrame ||
    window.mozCancelAnimationFrame || window.msCancelAnimationFrame;
  var requestFrame, cancelFrame;
  if(nativeRequestFrame && nativeCancelFrame){
    requestFrame=function(fn){ return nativeRequestFrame.call(window,fn); };
    cancelFrame=function(id){ nativeCancelFrame.call(window,id); };
  } else {
    requestFrame=function(fn){ return window.setTimeout(function(){ fn(now()); },16); };
    cancelFrame=function(id){ window.clearTimeout(id); };
  }

  function qs(name){
    var match=new RegExp("[?&]"+name+"=([^&]+)").exec(window.location.search);
    return match ? decodeURIComponent(match[1]) : null;
  }

  var source=DEFAULT_SRC;
  var requestedRenderer=qs("renderer") || "auto";
  var loopEnabled=qs("loop") !== "0";
  /* W-19: "fit" es el comportamiento historico (ocupa el panel, factor
     fraccionario). "int" es herramienta de comparacion, no candidato a
     producto: escala por un entero y deja letterbox, que es la unica forma de
     ver el aporte del filtro sin el remuestreo fraccionario encima. */
  var scaleMode=qs("scale")==="int" ? "int" : "fit";
  /* W-20: cadencia anclada al display con correccion lenta contra el audio, y
     pre-decode del proximo keyframe en el tiempo muerto. Los dos se pueden
     apagar desde el TV sin recompilar nada: ?pacing=off y ?predecode=off. */
  var pacingEnabled=qs("pacing") !== "off";
  var preDecodeEnabled=qs("predecode") !== "off";
  var phase=0, lastTick=0, paceFraction=0, paceStarted=false;
  var spareReader=null, spareIndex=-1, spareReady=false, preDecodeCost=0;
  var clipBuffer=null, clipOffset=0, clipLength=0;
  try { cacheStorage=window.localStorage || null; } catch(ignoredStorage) { cacheStorage=null; }
  var cacheTokens=window.ASCILINECacheRefresh.createTokenStore({
    source:source,
    storage:cacheStorage,
    storageKey:"ASCILINE_ASCLV_REFRESH_V1"
  });
  var hotspotGesture=new window.ASCILINECacheRefresh.GestureGuard(800);
  var refreshGesture=new window.ASCILINECacheRefresh.GestureGuard(800);
  var closeGesture=new window.ASCILINECacheRefresh.GestureGuard(800);

  function setNodeText(node,value){
    value=value || "";
    if(typeof node.textContent!=="undefined"){ node.textContent=value; }
    else { node.innerText=value; }
  }

  function setMessage(title, text, isError){
    setNodeText(headline,title);
    setNodeText(detail,text);
    stage.className=isError ? "error" : "";
  }

  function showTechMenu(show){
    techMenuVisible=!!show;
    techMenu.className=techMenuVisible ? "open" : "";
    techMenu.setAttribute("aria-hidden",techMenuVisible ? "false" : "true");
    techHotspot.className=techMenuVisible ? "active" : "";
    if(techMenuVisible){
      try { refreshVideoButton.focus(); } catch(ignored) {}
    } else {
      try { stage.focus(); } catch(ignoredFocus) {}
    }
  }

  function makeBlob(parts,type){
    try { return new Blob(parts,{type:type}); }
    catch(error){
      var Builder=window.BlobBuilder || window.WebKitBlobBuilder ||
        window.MozBlobBuilder || window.MSBlobBuilder;
      var builder, i;
      if(!Builder){ throw error; }
      builder=new Builder();
      for(i=0;i<parts.length;i++){ builder.append(parts[i]); }
      return builder.getBlob(type);
    }
  }

  function setAudio(bytes){
    if(!urlAPI || !urlAPI.createObjectURL){
      throw new Error("El navegador no ofrece object URL para el audio");
    }
    if(audioObjectURL && urlAPI.revokeObjectURL){
      urlAPI.revokeObjectURL(audioObjectURL);
    }
    audioObjectURL=urlAPI.createObjectURL(makeBlob([bytes],"audio/mpeg"));
    audio.src=audioObjectURL;
    audio.loop=loopEnabled;
    hasAudio=true;
  }

  function releaseAudio(){
    try { audio.pause(); } catch(ignoredPause) {}
    try { audio.removeAttribute("src"); } catch(ignoredAttribute) { audio.src=""; }
    try { if(audio.load){ audio.load(); } } catch(ignoredLoad) {}
    if(audioObjectURL && urlAPI && urlAPI.revokeObjectURL){
      try { urlAPI.revokeObjectURL(audioObjectURL); } catch(ignoredURL) {}
    }
    audioObjectURL=null;
    hasAudio=false;
  }

  function detachRendererEvents(){
    var watched=rendererEventCanvas, handler=rendererContextLostHandler;
    if(watched && handler){
      try {
        if(rendererEventLegacy && watched.detachEvent){
          watched.detachEvent("onwebglcontextlost",handler);
        } else if(watched.removeEventListener){
          watched.removeEventListener("webglcontextlost",handler,false);
        }
      } catch(ignoredDetach) {}
    }
    rendererEventCanvas=null;
    rendererContextLostHandler=null;
    rendererEventLegacy=false;
  }

  function disposeRenderer(releaseContext){
    var previous=renderer;
    detachRendererEvents();
    renderer=null;
    if(previous && typeof previous.dispose==="function"){
      try { previous.dispose(releaseContext===true); } catch(ignoredDispose) {}
    }
  }

  /* W-14: una perdida de contexto GPU transitoria no debe degradar a Canvas2D
     para siempre. Tras el fallback se escucha webglcontextrestored en el canvas
     perdido; si el contexto vuelve, se reintenta WebGL sobre un canvas nuevo. */
  var restoreWatchCanvas=null, restoreWatchHandler=null, restoreWatchLegacy=false;

  function detachRestoreWatch(){
    var watched=restoreWatchCanvas, handler=restoreWatchHandler;
    if(watched && handler){
      try {
        if(restoreWatchLegacy && watched.detachEvent){
          watched.detachEvent("onwebglcontextrestored",handler);
        } else if(watched.removeEventListener){
          watched.removeEventListener("webglcontextrestored",handler,false);
        }
      } catch(ignoredRestoreDetach) {}
    }
    restoreWatchCanvas=null;
    restoreWatchHandler=null;
    restoreWatchLegacy=false;
  }

  function watchContextRestore(canvasNode){
    detachRestoreWatch();
    if(!canvasNode || requestedRenderer==="canvas2d"){ return; }
    restoreWatchHandler=function(){
      detachRestoreWatch();
      if(!reader || rendererName!=="canvas2d"){ return; }
      try {
        chooseRenderer(activeReconstruction);
        drawCurrent();
        fitCanvas();
      } catch(error){
        try { fallbackToCanvas(false); } catch(secondError){ renderFailure(secondError); }
      }
    };
    try {
      if(canvasNode.addEventListener){
        canvasNode.addEventListener("webglcontextrestored",restoreWatchHandler,false);
      } else if(canvasNode.attachEvent){
        restoreWatchLegacy=true;
        canvasNode.attachEvent("onwebglcontextrestored",restoreWatchHandler);
      } else {
        restoreWatchHandler=null;
        return;
      }
    } catch(ignoredRestoreAttach){
      restoreWatchHandler=null;
      restoreWatchLegacy=false;
      return;
    }
    restoreWatchCanvas=canvasNode;
  }

  function freshCanvas(){
    var old=cv, replacement=document.createElement("canvas");
    replacement.id="cv";
    /* Reducir el backing store antes de retirar el nodo ayuda a liberar RAM/GPU
       incluso en WebViews que demoran la recoleccion del objeto canvas. */
    try { old.width=1; old.height=1; } catch(ignoredBackingStore) {}
    replacement.width=1;
    replacement.height=1;
    old.parentNode.replaceChild(replacement,old);
    cv=replacement;
  }

  function discardLoadedVideo(){
    /* El canvas viejo puede conservar el contexto y el renderer puede conservar
       buffers RGBA. Al cortar todas las referencias antes de la nueva XHR no
       coexistiran intencionalmente dos videos completos en memoria. */
    detachRestoreWatch();
    disposeRenderer(true);
    if(spareReader && typeof spareReader.dispose==="function"){
      try { spareReader.dispose(); } catch(ignoredSpareDispose) {}
    }
    spareReader=null;
    invalidateSpare();
    clipBuffer=null; clipOffset=0; clipLength=0;
    reader=null;
    lastShown=-1;
    rendererName="";
    freshCanvas();
  }

  function fallbackToCanvas(contextAlreadyLost){
    var instance=null;
    if(!reader){ throw new Error("No hay un frame decodificado para Canvas"); }
    disposeRenderer(contextAlreadyLost!==true);
    freshCanvas();
    try {
      instance=new window.Canvas2DRenderer(cv);
      instance.init(reader,1,activeReconstruction);
      renderer=instance;
      rendererName="canvas2d";
      /* Un Canvas nuevo siempre reconstruye completo desde las celdas actuales,
         aunque el reader conserve metadata dirty parcial del ultimo frame. */
      instance.draw(reader);
      fitCanvas();
    } catch(error){
      if(instance && typeof instance.dispose==="function"){
        try { instance.dispose(); } catch(ignoredCanvasDispose) {}
      }
      renderer=null;
      rendererName="";
      throw error;
    }
    return true;
  }

  function attachRendererEvents(){
    var watched;
    detachRendererEvents();
    if(rendererName!=="webgl" || !cv){ return; }
    watched=cv;
    rendererContextLostHandler=function(event){
      event=event || window.event;
      if(watched!==cv || rendererName!=="webgl"){ return; }
      if(event && event.preventDefault){ event.preventDefault(); }
      else if(event){ event.returnValue=false; }
      try {
        fallbackToCanvas(true);
        /* W-14: preventDefault permite que el contexto se restaure; si eso
           ocurre, volvemos a WebGL en lugar de quedar en Canvas para siempre. */
        watchContextRestore(watched);
      }
      catch(error){ renderFailure(error); }
    };
    try {
      if(watched.addEventListener){
        watched.addEventListener("webglcontextlost",rendererContextLostHandler,false);
      } else if(watched.attachEvent){
        rendererEventLegacy=true;
        watched.attachEvent("onwebglcontextlost",rendererContextLostHandler);
      } else {
        rendererContextLostHandler=null;
        return;
      }
    } catch(ignoredContextEvent){
      rendererContextLostHandler=null;
      rendererEventLegacy=false;
      return;
    }
    rendererEventCanvas=watched;
  }

  function chooseRenderer(reconstruction){
    var instance=null;
    activeReconstruction=reconstruction;
    disposeRenderer(true);
    freshCanvas();
    function tryWebGL(){
      var webgl=null;
      try {
        webgl=new window.WebGLRenderer(cv);
        if(webgl.init(reader,1,reconstruction)){ return webgl; }
      } catch(error) {}
      if(webgl && typeof webgl.dispose==="function"){
        try { webgl.dispose(true); } catch(ignoredWebGLDispose) {}
      }
      return null;
    }
    if(requestedRenderer==="canvas2d"){
      instance=new window.Canvas2DRenderer(cv);
      instance.init(reader,1,reconstruction);
      rendererName="canvas2d";
    } else {
      instance=tryWebGL();
      if(instance){ rendererName="webgl"; }
      else {
        /* Un canvas que llego a crear un contexto WebGL no puede reutilizarse
           como 2D. Esto tambien cubre GPUs viejas que fallan al compilar shaders. */
        freshCanvas();
        instance=new window.Canvas2DRenderer(cv);
        instance.init(reader,1,reconstruction);
        rendererName="canvas2d";
      }
    }
    renderer=instance;
    attachRendererEvents();
  }

  function viewportSize(){
    var root=document.documentElement;
    return {
      width:window.innerWidth || root.clientWidth || stage.clientWidth || 640,
      height:window.innerHeight || root.clientHeight || stage.clientHeight || 360
    };
  }

  function fitCanvas(){
    if(!reader || !cv){ return; }
    var size=viewportSize();
    var cols=reader.header.cols, rows=reader.header.rows;
    var ratio=cols/rows;
    var width=size.width, height=Math.round(width/ratio), factor;
    if(height>size.height){ height=size.height; width=Math.round(height*ratio); }
    if(scaleMode==="int"){
      factor=Math.floor(Math.min(size.width/cols,size.height/rows));
      if(factor<1){ factor=1; }
      width=cols*factor; height=rows*factor;
    }
    cv.style.width=width+"px";
    cv.style.height=height+"px";
    cv.style.marginLeft=(-Math.round(width/2))+"px";
    cv.style.marginTop=(-Math.round(height/2))+"px";
    /* W-19: el renderer necesita el tamano de presentacion para decidir su
       backing store en modo soft. Si lo cambia, la superficie queda en blanco
       y hay que volver a presentar el mismo frame (sin re-decodificar). */
    if(renderer && typeof renderer.setPresentationSize==="function"){
      if(renderer.setPresentationSize(width,height) &&
         typeof renderer.present==="function"){
        try { renderer.present(); } catch(ignoredPresent) {}
      }
    }
  }

  function drawCurrent(){
    var attempted=renderer, attemptedName=rendererName;
    try {
      attempted.draw(reader);
      return true;
    } catch(error){
      /* La decodificacion es unica. Si falla la salida GPU, Canvas recibe las
         mismas celdas del mismo frame sin reiniciar audio ni reloj. */
      if(attemptedName==="webgl"){
        /* Algunos motores entregan contextlost dentro de la llamada GL. Si su
           handler ya completo el fallback, la excepcion pertenece al contexto
           viejo y no debe detener el Canvas nuevo. */
        if(renderer!==attempted && rendererName==="canvas2d"){ return true; }
        fallbackToCanvas(false);
        return true;
      }
      throw error;
    }
  }

  function renderFailure(error){
    stop(false);
    setMessage("No se pudo dibujar el video",
      error && error.message ? error.message : "Canvas no disponible",true);
    return false;
  }

  /* W-20 (b): adoptar el keyframe ya decodificado es INTERCAMBIAR los dos
     readers, no copiar celdas. Cada uno queda internamente consistente -su
     paleta, su dirty y su decodedIndex viajan juntos-, asi que la
     transaccionalidad del invariante 4 no se toca. El adoptado trae dirtyFull
     de su propio keyframe, o sea que el renderer sube el cuadro entero, que es
     exactamente lo correcto. */
  function adoptSpare(){
    var previous=reader;
    reader=spareReader;
    spareReader=previous;
    spareReady=false;
    spareIndex=-1;
    if(renderer && renderer.reader){ renderer.reader=reader; }
  }

  function seekAndDraw(index){
    try {
      if(spareReady && spareIndex===index && spareReader){ adoptSpare(); }
      else { reader.seek(index); }
      drawCurrent();
      lastShown=index;
      return true;
    } catch(error){ return renderFailure(error); }
  }

  function invalidateSpare(){
    spareReady=false;
    spareIndex=-1;
  }

  function nextKeyframe(after){
    var i, last=reader.header.nFrames-1;
    var horizon=after+1+Math.round(reader.header.fps*3);
    if(typeof reader._isKey!=="function"){ return -1; }
    if(horizon>last){ horizon=last; }
    for(i=after+1;i<=horizon;i++){ if(reader._isKey(i)){ return i; } }
    return -1;
  }

  /* Tres de cada cuatro callbacks a 60 Hz para un video de 15 fps solo miran el
     reloj y vuelven a agendar. Ese tiempo se usa para adelantar el proximo
     KEYFRAME, que no depende del estado actual y por eso es seguro adelantar.
     Un delta exigiria una base definida y se disenaria aparte. */
  function preDecodeIdle(target){
    var slack, key, t0, cost;
    if(!preDecodeEnabled || !spareReader || spareReady){ return; }
    slack=(1-paceFraction)/reader.header.fps*1000;
    /* Solo si entra con margen: adelantar un keyframe que no llega a tiempo
       provoca exactamente el tiron que esto viene a sacar. */
    if(slack<preDecodeCost+4){ return; }
    key=nextKeyframe(target);
    if(key<0){ return; }
    t0=now();
    try { spareReader.seek(key); }
    catch(ignoredPreDecode){ spareReader=null; return; }
    cost=now()-t0;
    if(cost>preDecodeCost){ preDecodeCost=cost; }
    else { preDecodeCost=preDecodeCost*0.9+cost*0.1; }
    spareIndex=key;
    spareReady=true;
  }

  function openAscl(buffer,offset,length){
    var readerAPI=window.ASCILINEReader || window.ASCL;
    reader=readerAPI.parse(buffer,offset,length);
    clipBuffer=buffer; clipOffset=offset; clipLength=length;
    /* W-14: el reader v1 saltea la verificacion cuando el campo CRC es cero.
       En el TV eso significa reproducir bytes sin integridad verificada: se
       rechaza explicito. Todo artefacto del pipeline actual escribe su CRC. */
    if(reader.header.version===1 && !reader.header.crc32){
      reader=null;
      throw new Error("ASCL v1 sin CRC32: regenerar el artefacto con el encoder actual");
    }
    var reconstruction=(reader.header.flags & FLAG_RECON_SOFT) ? "soft" : "nearest";
    chooseRenderer(reconstruction);
    reader.decodedIndex=-1;
    reader.seek(0);
    drawCurrent();
    lastShown=0;
    ready=true;
    /* W-20 (b): el buffer alterno de `cells` es, en los hechos, un segundo
       reader sobre los MISMOS bytes. Cuesta otro `cells` (2 MB a 1920) y su
       scratch de inflate, y a cambio evita reescribir la maquinaria dirty del
       reader para decodificar fuera de linea. Si no se puede crear, el player
       sigue igual que antes: el pre-decode es una optimizacion, no un requisito.
       Anotado para MEM-001 (F8): esta es la unica estructura nueva por clip. */
    invalidateSpare();
    spareReader=null;
    preDecodeCost=0;
    if(preDecodeEnabled){
      try {
        spareReader=readerAPI.parse(clipBuffer,clipOffset,clipLength);
        spareReader.decodedIndex=-1;
      } catch(ignoredSpareReader){ spareReader=null; }
    }
    downloadButton.style.display="none";
    fitCanvas();
    setMessage("Presioná una tecla del 1 al 8 o hacé click",
      "ASCL v"+reader.header.version+" · "+reader.header.cols+"x"+reader.header.rows+" · "+reader.header.fps+
      " FPS · "+rendererName+" · audio "+(hasAudio?"incluido":"no disponible"),false);
    try { stage.focus(); } catch(ignored) {}
  }

  function loadBundle(buffer){
    var view=new DataView(buffer), bytes=new Uint8Array(buffer);
    /* F6-3: ASCLVID3 lleva header de 20 bytes con meta_len (sidecar embebido,
       que esta ruta de reproduccion pura no consume). */
    var headerSize=bytes[7]===51?20:16;
    var videoLength=view.getUint32(8,true);
    var audioLength=view.getUint32(12,true);
    var metaLength=headerSize===20?view.getUint32(16,true):0;
    if(videoLength<32 || headerSize+videoLength+audioLength+metaLength!==buffer.byteLength){
      throw new Error("ASCLV truncado o invalido");
    }
    if(bytes[7]-48!==bytes[headerSize+4]){
      throw new Error("La version ASCLV no coincide con el video interno");
    }
    if(audioLength>0){
      setAudio(new Uint8Array(buffer,headerSize+videoLength,audioLength));
    }
    openAscl(buffer,headerSize,videoLength);
  }

  function loadData(buffer,contentType){
    var bytes=new Uint8Array(buffer);
    var bundled=bytes.length>=8 && bytes[0]===65 && bytes[1]===83 &&
      bytes[2]===67 && bytes[3]===76 && bytes[4]===86 && bytes[5]===73 &&
      bytes[6]===68 && (bytes[7]===49 || bytes[7]===50 || bytes[7]===51);
    if(!bundled){
      throw new Error("La ruta "+source+" devolvio otro contenido"+
        (contentType ? " ("+contentType+")" : ""));
    }
    loadBundle(buffer);
  }

  /* Posicion segun el reloj maestro (el audio, si hay), en frames fraccionarios. */
  function clockFrames(){
    var seconds=hasAudio ? audio.currentTime : (now()-startT)/1000;
    return seconds*reader.header.fps;
  }

  /* W-20 (a): en TVs viejos audio.currentTime avanza a saltos gruesos, asi que
     decidir el cuadro con floor(currentTime*fps) reparte los frames en 5/7/6/6
     refrescos en vez de 6/6/6/6. Una cadencia irregular se percibe peor que un
     fps bajo constante (por eso se descarto el 1920@10). La fase avanza con el
     reloj del DISPLAY y se corrige LENTO contra el audio: el audio sigue siendo
     el maestro, lo que deja de decidir es el instante exacto de cada cuadro.
     Un desvio grande (seek, loop, stall) se resincroniza de una. */
  function pacedTarget(){
    var t=now(), dt=paceStarted ? t-lastTick : 0, clock=clockFrames(), drift;
    lastTick=t;
    if(!pacingEnabled){
      paceFraction=clock-Math.floor(clock);
      return Math.floor(clock);
    }
    if(!paceStarted){
      /* Primer cuadro despues de un reset: todavia no hay cadencia observada,
         asi que se engancha al reloj maestro sin corregir nada. La bandera es
         explicita porque now() puede valer 0 justo al abrir la pagina. */
      paceStarted=true;
      phase=clock;
      paceFraction=phase-Math.floor(phase);
      return Math.floor(phase);
    }
    if(dt<0 || dt>250){ dt=0; }
    phase+=dt*reader.header.fps/1000;
    drift=clock-phase;
    if(drift>2 || drift<-2){ phase=clock; }
    else { phase+=drift*0.02; }
    paceFraction=phase-Math.floor(phase);
    return Math.floor(phase);
  }

  function resetPacing(atFrame){
    phase=atFrame>0 ? atFrame : 0;
    lastTick=0;
    paceFraction=0;
    paceStarted=false;
  }

  function stop(showPrompt){
    playing=false;
    stage.className="";
    if(raf){ cancelFrame(raf); raf=0; }
    if(hasAudio){ try { audio.pause(); } catch(ignored) {} }
    if(showPrompt){
      setMessage("Finalizado · presioná 1 a 8 o hacé click para repetir",
        rendererName+" · pantalla completa",false);
    }
  }

  function restart(){
    if(hasAudio){
      try { audio.currentTime=0; } catch(ignored) {}
    }
    reader.decodedIndex=-1;
    invalidateSpare();
    resetPacing(0);
    return seekAndDraw(0);
  }

  function loop(){
    var target, count;
    if(!playing){ return; }
    target=pacedTarget();
    count=reader.header.nFrames;
    if(target>=count){
      if(loopEnabled && !hasAudio){
        if(!restart()){ return; }
        startT=now(); resetPacing(0); target=0;
      } else if(!hasAudio){
        if(!seekAndDraw(count-1)){ return; }
        stop(true);
        return;
      } else { target=count-1; }
    }
    if(target!==lastShown){
      if(!seekAndDraw(target)){ return; }
    } else {
      preDecodeIdle(target);
    }
    raf=requestFrame(loop);
  }

  function start(){
    var result;
    if(!ready){
      if(!activeXHR){
        beginDownload(true);
      } else {
        setMessage("El video todavía se está cargando",
          "Esperá unos segundos y volvé a presionar",false);
      }
      return null;
    }
    if(playing){ return null; }
    if(lastShown>=reader.header.nFrames-1 || (hasAudio && audio.ended)){
      if(!restart()){ return null; }
    }
    playing=true;
    stage.className="playing";
    startT=now()-(lastShown/reader.header.fps)*1000;
    resetPacing(lastShown);
    if(hasAudio){
      try {
        result=audio.play();
        if(result && typeof result["catch"]==="function"){
          result["catch"](function(){
            stop(false);
            setMessage("El TV bloqueó el audio",
              "Presioná otra vez una tecla del 1 al 8 o hacé click",true);
          });
        }
      } catch(error){
        stop(false);
        setMessage("No se pudo iniciar el audio","Volvé a presionar para reintentar",true);
        return null;
      }
    }
    raf=requestFrame(loop);
    /* El rechazo de audio ya se informa arriba. No devolverlo evita que el
       controlador lo confunda con un rechazo de la solicitud fullscreen. */
    return null;
  }

  audio.onended=function(){ if(!loopEnabled){ stop(true); } };
  window.onresize=fitCanvas;
  document.addEventListener && document.addEventListener("fullscreenchange",fitCanvas,false);
  document.addEventListener && document.addEventListener("webkitfullscreenchange",fitCanvas,false);
  document.addEventListener && document.addEventListener("mozfullscreenchange",fitCanvas,false);
  document.addEventListener && document.addEventListener("MSFullscreenChange",fitCanvas,false);

  window.ASCILINETV.init({
    document:document,
    surface:stage,
    fullscreenElement:document.documentElement || stage,
    play:start,
    onError:function(){
      if(ready && !playing){
        setMessage("No se pudo activar pantalla completa",
          "El video igualmente puede reproducirse dentro del navegador",true);
      }
    }
  });

  function stopButtonEvent(event){
    event=event || window.event;
    if(event.stopPropagation){ event.stopPropagation(); }
    event.cancelBubble=true;
    if(event.preventDefault){ event.preventDefault(); }
    else { event.returnValue=false; }
  }

  function releaseXHRHandlers(xhr){
    if(!xhr){ return; }
    try { xhr.onprogress=null; } catch(ignoredProgressHandler) {}
    try { xhr.onload=null; } catch(ignoredLoadHandler) {}
    try { xhr.onerror=null; } catch(ignoredErrorHandler) {}
    try { xhr.onabort=null; } catch(ignoredAbortHandler) {}
  }

  /* CACHE-001 (F6-4): la descarga tiene dos etapas. Primero el PUNTERO
     clip.current.txt (mutable, chico; el no-cache del refresco aplica aca):
     si declara un clip versionado valido, se descarga ese recurso INMUTABLE
     sin token; si no existe o es invalido, se cae al clip.asclv historico con
     el token de renovacion. Ambas etapas comparten las guardas de activeXHR. */
  function beginDownload(manual,forceRefresh){
    var pointerXHR, previous;
    function fallback(){
      downloadVideo(manual,forceRefresh,cacheTokens.url(forceRefresh===true),false);
    }
    if(!window.XMLHttpRequest){
      setMessage("Este navegador no ofrece carga binaria XHR","No puede abrir ASCLV",true);
      return;
    }
    if(activeXHR){
      previous=activeXHR;
      activeXHR=null;
      try { previous.abort(); } catch(ignored) {}
      releaseXHRHandlers(previous);
    }
    pointerXHR=new XMLHttpRequest();
    activeXHR=pointerXHR;
    try {
      pointerXHR.open("GET",POINTER_SRC,true);
      if(forceRefresh && pointerXHR.setRequestHeader){
        try { pointerXHR.setRequestHeader("Cache-Control","no-cache"); } catch(ignoredCacheHeader) {}
        try { pointerXHR.setRequestHeader("Pragma","no-cache"); } catch(ignoredPragmaHeader) {}
      }
    } catch(error){
      if(activeXHR===pointerXHR){ activeXHR=null; }
      releaseXHRHandlers(pointerXHR);
      fallback();
      return;
    }
    pointerXHR.onload=function(){
      var name="";
      if(activeXHR!==pointerXHR){ releaseXHRHandlers(pointerXHR); return; }
      activeXHR=null;
      releaseXHRHandlers(pointerXHR);
      if(pointerXHR.status===200){
        name=window.ASCILINECacheRefresh.parseClipPointer(pointerXHR.responseText||"");
      }
      if(name){
        downloadVideo(manual,forceRefresh,POINTER_DIR+name,true);
      } else {
        fallback();
      }
    };
    pointerXHR.onerror=function(){
      if(activeXHR!==pointerXHR){ releaseXHRHandlers(pointerXHR); return; }
      activeXHR=null;
      releaseXHRHandlers(pointerXHR);
      fallback();
    };
    pointerXHR.onabort=function(){
      if(activeXHR===pointerXHR){ activeXHR=null; }
      releaseXHRHandlers(pointerXHR);
    };
    try { pointerXHR.send(); }
    catch(error){
      if(activeXHR===pointerXHR){ activeXHR=null; }
      releaseXHRHandlers(pointerXHR);
      fallback();
    }
  }

  function downloadVideo(manual,forceRefresh,requestSource,immutable){
    var xhr;
    xhr=new XMLHttpRequest();
    activeXHR=xhr;
    if(manual){
      setMessage(forceRefresh ? "Actualizando video…" : "Iniciando descarga…",
        forceRefresh ? "Renovando solamente este archivo ASCLV" :
          "Solicitada desde el control remoto",false);
    }
    try {
      xhr.open("GET",requestSource,true);
      xhr.responseType="arraybuffer";
      /* Un recurso versionado por contenido nunca se fuerza a no-cache:
         invalidar es cambiar el nombre en el puntero, no vaciar la cache. */
      if(forceRefresh && !immutable && xhr.setRequestHeader){
        try { xhr.setRequestHeader("Cache-Control","no-cache"); } catch(ignoredCacheHeader) {}
        try { xhr.setRequestHeader("Pragma","no-cache"); } catch(ignoredPragmaHeader) {}
      }
    } catch(error){
      if(activeXHR===xhr){ activeXHR=null; }
      releaseXHRHandlers(xhr);
      setMessage("El navegador no puede descargar ASCLV binario",
        error.message || "XHR ArrayBuffer no disponible",true);
      return;
    }
    xhr.onprogress=function(event){
      if(activeXHR!==xhr){ releaseXHRHandlers(xhr); return; }
      if(event && event.lengthComputable && event.total>0){
        setMessage("Cargando video… "+Math.round(event.loaded*100/event.total)+"%",
          "Quedará cacheado por el navegador",false);
      }
    };
    xhr.onload=function(){
      var status, response, contentType="";
      if(activeXHR!==xhr){ releaseXHRHandlers(xhr); return; }
      status=xhr.status;
      response=xhr.response;
      if(xhr.getResponseHeader){
        try { contentType=xhr.getResponseHeader("Content-Type") || ""; }
        catch(ignoredResponseHeader) {}
      }
      activeXHR=null;
      releaseXHRHandlers(xhr);
      if((status>=200 && status<300) || status===0){
        try {
          if(!response || typeof response.byteLength!=="number"){
            throw new Error("El navegador no entrego un ArrayBuffer");
          }
          loadData(response,contentType);
        }
        catch(error){
          stop(false);
          ready=false;
          releaseAudio();
          discardLoadedVideo();
          downloadButton.style.display="block";
          setMessage("No se pudo abrir el ASCLV",error.message,true);
        }
      } else {
        setMessage("No se pudo cargar el video","HTTP "+status+" · "+source,true);
      }
    };
    xhr.onerror=function(){
      if(activeXHR!==xhr){ releaseXHRHandlers(xhr); return; }
      activeXHR=null;
      releaseXHRHandlers(xhr);
      setMessage("No se pudo cargar el video",
        "Usá Iniciar descarga y verificá que exista "+source,true);
    };
    xhr.onabort=function(){
      if(activeXHR===xhr){ activeXHR=null; }
      releaseXHRHandlers(xhr);
    };
    try { xhr.send(); }
    catch(error){
      if(activeXHR===xhr){ activeXHR=null; }
      releaseXHRHandlers(xhr);
      setMessage("No se pudo iniciar la descarga",error.message || source,true);
    }
  }

  function refreshCurrentVideo(){
    stop(false);
    ready=false;
    releaseAudio();
    discardLoadedVideo();
    downloadButton.style.display="block";
    showTechMenu(false);
    beginDownload(true,true);
  }

  downloadButton.onclick=function(event){
    var time=now();
    stopButtonEvent(event);
    if(lastDownloadTouch>=0 && time>=lastDownloadTouch && time-lastDownloadTouch<800){
      return false;
    }
    beginDownload(true);
    return false;
  };
  downloadButton.ontouchend=function(event){
    stopButtonEvent(event);
    lastDownloadTouch=now();
    beginDownload(true);
    return false;
  };

  function handleHotspot(event){
    event=event || window.event;
    stopButtonEvent(event);
    if(!hotspotGesture.accept(event.type,now())){ return false; }
    showTechMenu(!techMenuVisible);
    return false;
  }

  function handleRefresh(event){
    event=event || window.event;
    stopButtonEvent(event);
    if(!refreshGesture.accept(event.type,now())){ return false; }
    refreshCurrentVideo();
    return false;
  }

  function handleCloseTechMenu(event){
    event=event || window.event;
    stopButtonEvent(event);
    if(!closeGesture.accept(event.type,now())){ return false; }
    showTechMenu(false);
    return false;
  }

  function handleTechKey(event){
    event=event || window.event;
    if(!window.ASCILINECacheRefresh.isMenuKey(event)){ return; }
    stopButtonEvent(event);
    showTechMenu(!techMenuVisible);
  }

  techHotspot.onclick=handleHotspot;
  techHotspot.ontouchend=handleHotspot;
  refreshVideoButton.onclick=handleRefresh;
  refreshVideoButton.ontouchend=handleRefresh;
  closeTechMenuButton.onclick=handleCloseTechMenu;
  closeTechMenuButton.ontouchend=handleCloseTechMenu;
  techMenu.onclick=stopButtonEvent;
  techMenu.ontouchend=stopButtonEvent;
  if(document.addEventListener){ document.addEventListener("keydown",handleTechKey,false); }
  else if(document.attachEvent){ document.attachEvent("onkeydown",handleTechKey); }

  beginDownload(false);
}());
</script>
</body>
</html>
